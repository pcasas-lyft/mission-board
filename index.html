<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Todo Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --accent: #6c8ef5;
      --accent-dim: #3d4f8a;
      --text: #e2e6f3;
      --text-muted: #7b82a0;
      --done-text: #4a5068;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
      --purple: #c084fc;
      --radius: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .week-nav { display: flex; align-items: center; gap: 10px; }
    .week-label { font-size: 13px; color: var(--text-muted); min-width: 160px; text-align: center; }
    .nav-btn, .add-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 7px; cursor: pointer;
      font-size: 14px; transition: background 0.15s;
    }
    .nav-btn { padding: 6px 11px; }
    .nav-btn:hover { background: var(--border); }
    .add-btn { background: var(--accent); border-color: var(--accent); color: #fff; padding: 7px 16px; font-weight: 600; }
    .add-btn:hover { background: #7b9df7; }

    /* ── Sync indicator ── */
    .sync-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted); flex-shrink: 0;
      transition: background 0.2s;
    }
    .sync-dot.saving  { background: var(--yellow); animation: pulse 0.8s infinite alternate; }
    .sync-dot.saved   { background: var(--green); }
    .sync-dot.error   { background: var(--red); }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.3; } }

    /* ── Ongoing band ── */
    .ongoing-band {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 14px;
    }
    .ongoing-band-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .ongoing-band-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--purple);
    }
    .ongoing-band-count {
      font-size: 11px; color: var(--text-muted);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 1px 7px;
    }
    .ongoing-band-cards {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px;
    }
    .ongoing-band-cards::-webkit-scrollbar { height: 4px; }
    .ongoing-band-cards::-webkit-scrollbar-track { background: transparent; }
    .ongoing-band-cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .ongoing-card {
      background: var(--surface2);
      border: 1px solid var(--purple);
      border-radius: var(--radius);
      padding: 10px 12px;
      min-width: 200px;
      max-width: 240px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .ongoing-card:hover { background: #2a2040; }
    .ongoing-card.active-now { border-color: var(--green); background: rgba(74,222,128,0.06); }
    .ongoing-card.active-now:hover { background: rgba(74,222,128,0.1); }
    .ongoing-card.done { opacity: 0.5; }
    .ongoing-card.done .task-title { text-decoration: line-through; color: var(--done-text); }
    .ongoing-card .task-top { display: flex; align-items: flex-start; gap: 8px; }
    .ongoing-card .task-title { font-size: 13px; font-weight: 500; line-height: 1.4; flex: 1; word-break: break-word; }

    /* Active now indicator */
    .active-dot-btn {
      display: flex; align-items: center; gap: 5px;
      background: transparent; border: none; cursor: pointer;
      padding: 0; margin-top: 8px; width: 100%;
    }
    .active-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border); flex-shrink: 0; transition: background 0.2s;
    }
    .active-dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(74,222,128,0.2); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(74,222,128,0.3); }
      50%       { box-shadow: 0 0 0 5px rgba(74,222,128,0.08); }
    }
    .active-dot.on { animation: pulse 2s infinite; }
    .active-dot-label { font-size: 11px; color: var(--text-muted); transition: color 0.2s; }
    .active-dot-btn:hover .active-dot-label { color: var(--text); }
    .active-now .active-dot-label { color: var(--green); font-weight: 600; }

    /* ── Board ── */
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 1px;
      background: var(--border);
      min-height: calc(100vh - 120px);
    }
    .column { background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
    .column-header {
      padding: 12px 10px 8px;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
    }
    .column-header .day-name {
      font-weight: 700; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-muted);
    }
    .column-header.today .day-name { color: var(--accent); }
    .column-header .day-date { font-size: 20px; font-weight: 700; margin-top: 2px; line-height: 1; }
    .column-header.today .day-date { color: var(--accent); }
    .column-header .task-count { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .column-body { padding: 8px; flex: 1; }

    /* ── Task cards ── */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 11px;
      margin-bottom: 7px;
      cursor: grab;
      transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    }
    .task-card:hover { border-color: var(--accent-dim); background: var(--surface2); }
    .task-card.done { opacity: 0.5; }
    .task-card.done .task-title { text-decoration: line-through; color: var(--done-text); }
    .task-card.dragging, .ongoing-card.dragging { opacity: 0.3; cursor: grabbing; }

    .column-body.drag-over { background: rgba(108,142,245,0.07); outline: 2px dashed var(--accent-dim); outline-offset: -4px; border-radius: var(--radius); }
    .ongoing-band-cards.drag-over { outline: 2px dashed var(--purple); outline-offset: 2px; border-radius: var(--radius); background: rgba(192,132,252,0.07); }

    .task-card.drop-before { border-top: 2px solid var(--accent); margin-top: -1px; }
    .task-card.drop-after  { border-bottom: 2px solid var(--accent); }

    .task-top { display: flex; align-items: flex-start; gap: 7px; }
    .task-checkbox {
      width: 15px; height: 15px; border-radius: 4px;
      border: 2px solid var(--border); background: transparent;
      cursor: pointer; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .task-card.done .task-checkbox,
    .ongoing-card.done .task-checkbox { background: var(--green); border-color: var(--green); }
    .task-checkbox svg { display: none; }
    .task-card.done .task-checkbox svg,
    .ongoing-card.done .task-checkbox svg { display: block; }
    .task-title { font-size: 13px; font-weight: 500; line-height: 1.4; flex: 1; word-break: break-word; }

    .task-meta { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
    .priority-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 2px 5px; border-radius: 4px;
    }
    .priority-high { background: rgba(248,113,113,0.15); color: var(--red); }
    .priority-medium { background: rgba(251,191,36,0.15); color: var(--yellow); }
    .priority-low { background: rgba(74,222,128,0.12); color: var(--green); }

    .subtask-progress {
      font-size: 10px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); padding: 1px 6px; border-radius: 4px;
    }
    .subtask-progress.all-done { border-color: var(--green); color: var(--green); background: rgba(74,222,128,0.08); }
    .has-notes-icon { font-size: 11px; color: var(--text-muted); }

    /* ── Status badges ── */
    .status-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 2px 6px; border-radius: 4px;
    }
    .status-in-progress { background: rgba(108,142,245,0.15); color: var(--accent); }
    .status-in-review   { background: rgba(251,191,36,0.15);  color: var(--yellow); }
    .status-blocked     { background: rgba(248,113,113,0.15); color: var(--red); }

    /* ── Blocked reason on card ── */
    .blocked-reason {
      font-size: 11px; color: var(--red);
      margin-top: 5px; padding: 3px 7px;
      background: rgba(248,113,113,0.07);
      border-radius: 4px; border-left: 2px solid var(--red);
    }

    /* ── PR link on card ── */
    .pr-link {
      font-size: 11px; color: var(--accent);
      text-decoration: none; display: inline-flex; align-items: center; gap: 3px;
    }
    .pr-link:hover { text-decoration: underline; }

    /* ── Progress log in modal ── */
    .log-section { margin-top: 18px; }
    .log-section-header {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .log-count {
      font-size: 10px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 1px 7px; text-transform: none; letter-spacing: 0;
    }
    .log-add-row {
      display: flex; gap: 7px; margin-bottom: 12px;
    }
    .log-add-row textarea {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px;
      padding: 8px 10px; outline: none; font-family: inherit;
      resize: none; height: 38px; line-height: 1.4;
      transition: border-color 0.15s, height 0.1s;
    }
    .log-add-row textarea:focus { border-color: var(--accent); height: 70px; }
    .log-add-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 8px; cursor: pointer;
      font-size: 12px; padding: 0 12px; white-space: nowrap;
      transition: background 0.15s, color 0.15s; align-self: flex-start; height: 38px;
    }
    .log-add-btn:hover { background: var(--border); color: var(--text); }
    .log-timeline { display: flex; flex-direction: column; gap: 0; }
    .log-entry {
      display: flex; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .log-entry:last-child { border-bottom: none; }
    .log-entry-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-dim); border: 2px solid var(--accent);
      flex-shrink: 0; margin-top: 5px;
    }
    .log-entry-body { flex: 1; min-width: 0; }
    .log-entry-date {
      font-size: 10px; color: var(--text-muted); margin-bottom: 2px;
    }
    .log-entry-text {
      font-size: 13px; color: var(--text); line-height: 1.45; word-break: break-word;
    }
    /* Most recent log entry shown on cards */
    .card-log-entry {
      font-size: 11px; color: var(--text-muted); margin-top: 5px;
      line-height: 1.35; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Inline subtasks on cards */
    .card-subtasks { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .card-subtask {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 0;
    }
    .card-st-box {
      width: 13px; height: 13px; border-radius: 3px;
      border: 1.5px solid var(--border); background: transparent;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; cursor: pointer;
    }
    .card-st-box.checked { background: var(--green); border-color: var(--green); }
    .card-st-box.checked svg { display: block; }
    .card-st-box svg { display: none; }
    .card-st-text {
      font-size: 12px; color: var(--text-muted); line-height: 1.3;
      flex: 1; word-break: break-word;
    }
    .card-st-text.checked { text-decoration: line-through; color: var(--done-text); }

    .col-add-btn {
      width: 100%; background: transparent; border: 1px dashed var(--border);
      border-radius: var(--radius); color: var(--text-muted); font-size: 12px;
      padding: 7px; cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .col-add-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
    .empty-col { color: var(--text-muted); font-size: 12px; text-align: center; padding: 14px 6px; opacity: 0.6; }
    .column.unscheduled .column-header .day-name { color: var(--yellow); }
    .column.past { opacity: 0.7; }
    .column-header.past .day-name { color: var(--text-muted); }
    .past-tag {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); padding: 1px 4px; border-radius: 3px;
      vertical-align: middle; margin-left: 4px;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; width: 500px; max-width: 95vw; max-height: 90vh;
      overflow-y: auto; box-shadow: var(--shadow); padding: 26px;
    }
    .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; }

    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.6px;
      color: var(--text-muted); margin-bottom: 5px;
    }
    .form-group input:not(.st-text):not(.st-check),
    .form-group select,
    .form-group textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
      padding: 9px 11px; outline: none; font-family: inherit; transition: border-color 0.15s;
    }
    .form-group input:not(.st-text):not(.st-check):focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-group select option { background: var(--surface2); }
    .form-group input:not(.st-text):not(.st-check):disabled,
    .form-group select:disabled { opacity: 0.4; cursor: not-allowed; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Ongoing toggle */
    .toggle-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; cursor: pointer;
      margin-bottom: 15px; transition: border-color 0.15s;
    }
    .toggle-row:hover { border-color: var(--purple); }
    .toggle-row.active { border-color: var(--purple); background: rgba(192,132,252,0.08); }
    .toggle-knob {
      width: 32px; height: 18px; background: var(--border); border-radius: 9px;
      flex-shrink: 0; position: relative; transition: background 0.2s;
    }
    .toggle-knob::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-row.active .toggle-knob { background: var(--purple); }
    .toggle-row.active .toggle-knob::after { transform: translateX(14px); }
    .toggle-label { font-size: 13px; font-weight: 500; flex: 1; }
    .toggle-sublabel { font-size: 11px; color: var(--text-muted); }

    /* Subtasks */
    .subtask-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .subtask-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 10px;
    }
    .subtask-item.done-item .st-text { text-decoration: line-through; color: var(--done-text); }
    .st-check {
      width: 14px; height: 14px; accent-color: var(--green);
      cursor: pointer; flex-shrink: 0;
    }
    .subtask-item .st-text {
      flex: 1; min-width: 0; background: transparent; border: none; color: var(--text);
      font-size: 13px; font-family: inherit; outline: none; padding: 0;
    }
    .st-del {
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1;
      transition: color 0.15s;
    }
    .st-del:hover { color: var(--red); }
    .add-subtask-btn {
      background: transparent; border: 1px dashed var(--border);
      border-radius: 7px; color: var(--text-muted); font-size: 12px;
      padding: 6px 10px; cursor: pointer; width: 100%;
      text-align: left; transition: all 0.15s; font-family: inherit;
    }
    .add-subtask-btn:hover { border-color: var(--accent-dim); color: var(--accent); }

    .modal-actions {
      display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px;
    }
    .btn-cancel {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 16px;
      cursor: pointer; font-size: 14px;
    }
    .btn-cancel:hover { background: var(--border); }
    .btn-save {
      background: var(--accent); border: none; color: #fff;
      border-radius: 8px; padding: 8px 18px; cursor: pointer;
      font-size: 14px; font-weight: 600;
    }
    .btn-save:hover { background: #7b9df7; }
    .btn-delete {
      background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.25);
      color: var(--red); border-radius: 8px; padding: 8px 16px;
      cursor: pointer; font-size: 14px; margin-right: auto;
    }
    .btn-delete:hover { background: rgba(248,113,113,0.22); }

    @media (max-width: 600px) { .board { grid-template-columns: repeat(2, 1fr) !important; } }

    /* ── Jira badge on cards ── */
    .jira-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 600; font-family: monospace;
      padding: 2px 6px; border-radius: 4px;
      background: rgba(0,82,204,0.18); color: #6fa8ff;
      border: 1px solid rgba(111,168,255,0.3);
      text-decoration: none; white-space: nowrap;
      transition: background 0.15s;
    }
    .jira-badge:hover { background: rgba(0,82,204,0.3); }

    /* ── Jira preview in modal ── */
    .jira-preview {
      font-size: 12px; color: var(--text-muted);
      padding: 6px 10px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 6px;
      margin-top: 6px; min-height: 28px;
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap;
    }
    .jira-preview:empty { display: none; }
    .jira-status-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .jira-status-dot.yellow { background: var(--yellow); }
    .jira-status-dot.green  { background: var(--green); }
    .jira-status-dot.blue-grey { background: var(--text-muted); }

    /* ── Jira settings button in header ── */
    .jira-config-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 7px; cursor: pointer;
      font-size: 12px; padding: 6px 9px; transition: background 0.15s, color 0.15s;
      display: flex; align-items: center; gap: 5px;
    }
    .jira-config-btn:hover { background: var(--border); color: var(--text); }
    .jira-config-btn .jira-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
    }
    .jira-config-btn .jira-dot.on { background: var(--green); }

    /* ── Jira settings modal ── */
    .jira-modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 200;
      align-items: center; justify-content: center;
    }
    .jira-modal-overlay.open { display: flex; }
    .jira-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; width: 420px; max-width: 95vw;
      box-shadow: var(--shadow); padding: 24px;
    }
    .jira-modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .jira-modal .jira-subtitle {
      font-size: 12px; color: var(--text-muted); margin-bottom: 18px;
    }
    .jira-modal .jira-subtitle a { color: var(--accent); }

    /* ── Update modal ── */
    .update-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 7px; cursor: pointer;
      font-size: 14px; padding: 6px 10px; transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .update-btn:hover { background: var(--border); color: var(--text); }
    .update-btn.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .update-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 200;
      align-items: center; justify-content: center;
    }
    .update-overlay.open { display: flex; }
    .update-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; width: 460px; max-width: 95vw;
      box-shadow: var(--shadow); padding: 24px;
    }
    .update-modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
    .update-output {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px;
      font-family: monospace; font-size: 12px; color: var(--text-muted);
      white-space: pre-wrap; word-break: break-all;
      max-height: 180px; overflow-y: auto; margin-bottom: 16px;
    }
    .update-actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>

<header>
  <h1>Weekly Planner</h1>
  <div class="week-nav">
    <button class="nav-btn" id="prevWeek">&#8592;</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="nav-btn" id="nextWeek">&#8594;</button>
    <button class="nav-btn" id="todayBtn">Today</button>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="sync-dot" id="syncDot" title="Sync status"></div>
    <button class="update-btn" id="updateBtn" title="Pull latest updates from GitHub">↑</button>
    <button class="jira-config-btn" id="jiraConfigBtn" title="Jira settings">
      <span class="jira-dot" id="jiraDot"></span>Jira
    </button>
    <button class="add-btn" id="openAddModal">+ New Task</button>
  </div>
</header>

<div class="update-overlay" id="updateOverlay">
  <div class="update-modal">
    <h2 id="updateTitle">Checking for updates…</h2>
    <div class="update-output" id="updateOutput"></div>
    <div class="update-actions">
      <button class="btn-cancel" id="updateRestartBtn" style="display:none">Restart Server</button>
      <button class="btn-cancel" id="updateCloseBtn">Close</button>
    </div>
  </div>
</div>

<!-- Jira Settings Modal -->
<div class="jira-modal-overlay" id="jiraModalOverlay">
  <div class="jira-modal">
    <h2>Jira Setup</h2>
    <p class="jira-subtitle">
      Generate a token at
      <a href="https://jira.lyft.net/secure/ViewProfile.jspa?selectedTab=com.atlassian.pats.pats-plugin:jira-user-personal-access-tokens" target="_blank" rel="noopener">
        jira.lyft.net → Profile → Personal Access Tokens
      </a>
    </p>
    <div class="form-group">
      <label>Base URL</label>
      <input type="text" id="jiraBaseUrl" value="https://jira.lyft.net" />
    </div>
    <div class="form-group">
      <label>Personal Access Token</label>
      <input type="password" id="jiraToken" placeholder="Paste your PAT here" autocomplete="off" />
    </div>
    <div class="update-actions" style="margin-top:18px">
      <button class="btn-cancel" id="jiraModalClose">Cancel</button>
      <button class="btn-save" id="jiraModalSave">Save</button>
    </div>
  </div>
</div>

<div class="ongoing-band" id="ongoingBand" style="display:none">
  <div class="ongoing-band-header">
    <span class="ongoing-band-title">This Week</span>
    <span class="ongoing-band-count" id="ongoingCount"></span>
  </div>
  <div class="ongoing-band-cards" id="ongoingCards"></div>
</div>

<div class="board" id="board"></div>

<!-- Task Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">New Task</h2>

    <div class="form-group">
      <label>Task Title</label>
      <input type="text" id="taskTitle" placeholder="What needs to get done?" />
    </div>

    <div id="ongoingToggle" class="toggle-row">
      <div class="toggle-knob"></div>
      <div>
        <div class="toggle-label">Spans all week</div>
        <div class="toggle-sublabel">Shows in the "This Week" band — not tied to a single day</div>
      </div>
    </div>

    <div id="dayPriorityRow" class="form-row">
      <div class="form-group">
        <label>Day</label>
        <select id="taskDay">
          <option value="unscheduled">Unscheduled</option>
          <option value="0">Monday</option>
          <option value="1">Tuesday</option>
          <option value="2">Wednesday</option>
          <option value="3">Thursday</option>
          <option value="4">Friday</option>
          <option value="5">Saturday</option>
          <option value="6">Sunday</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="taskPriority">
          <option value="none">None</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select id="taskStatus">
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="in-review">In Review</option>
          <option value="blocked">Blocked</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="form-group">
        <label>PR / Branch</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="text" id="taskPrLink" placeholder="https://github.com/..." style="flex:1" />
          <a id="prLinkOpen" href="#" target="_blank" rel="noopener"
             style="display:none;font-size:13px;color:var(--accent);padding:0 4px;text-decoration:none"
             title="Open PR">↗</a>
        </div>
      </div>
    </div>

    <div class="form-group" id="blockedOnRow" style="display:none">
      <label>Blocked on</label>
      <input type="text" id="taskBlockedOn" placeholder="Who or what is blocking this?" />
    </div>

    <div class="form-group" id="jiraKeyRow">
      <label>Jira Ticket</label>
      <input type="text" id="taskJiraKey" placeholder="e.g. ENG-123" style="width:140px" />
      <div class="jira-preview" id="jiraPreview"></div>
    </div>

    <div class="form-group">
      <label>Subtasks</label>
      <div class="subtask-list" id="subtaskList"></div>
      <button type="button" class="add-subtask-btn" id="addSubtaskBtn">+ Add subtask</button>
    </div>

    <div class="form-group">
      <label>Notes / Next steps</label>
      <textarea id="taskNotes" placeholder="Current state, next steps, blockers..."></textarea>
    </div>

    <div class="log-section">
      <div class="log-section-header">
        Progress Log <span class="log-count" id="logCount">0</span>
      </div>
      <div class="log-add-row">
        <textarea id="logNewEntry" placeholder="What happened? What did you build or decide?"></textarea>
        <button type="button" class="log-add-btn" id="logAddBtn">Add</button>
      </div>
      <div class="log-timeline" id="logTimeline"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-delete" id="deleteTaskBtn" style="display:none">Delete</button>
      <button class="btn-cancel" id="closeModal">Cancel</button>
      <button class="btn-save" id="saveTask">Save Task</button>
    </div>
  </div>
</div>

<script>
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const STORAGE_KEY = 'weekly-todos-v2';

  const INITIAL_TASKS = [
    { id: 't1', title: 'Subscriptions work',          ongoing: true,  day: 'unscheduled', priority: 'none', notes: '• Follow up with Jeorge MR for comms platform work', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't0', title: 'Android comms work',          ongoing: true,  day: 'unscheduled', priority: 'high', notes: 'In progress — moved up in priority', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't2', title: 'Opt-in screen',               ongoing: true,  day: 'unscheduled', priority: 'none', notes: '', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't3', title: 'Rewards VR header',            ongoing: false, day: 'unscheduled', priority: 'none', notes: '• Check with Zoe the assets are uploaded', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't4', title: 'TCS MCP Experiment setup exploration', ongoing: false, day: 'unscheduled', priority: 'none', notes: '', subtasks: [{ id: 'st4a', text: 'Connect with Shaina about TCS MCP', done: false }], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't5', title: 'FFs to killswitches for Brooke', ongoing: false, day: '2026-04-28', priority: 'none', notes: 'Due in May', subtasks: [{ id: 'st5a', text: 'Review spreadsheet', done: false }], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't6', title: 'Coverage area map cleanup',   ongoing: false, day: '2026-04-28', priority: 'none', notes: '', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't7', title: 'Hao and profile badges',      ongoing: false, day: 'unscheduled', priority: 'none', notes: '', subtasks: [{ id: 'st7a', text: 'Pending rollout to 100%', done: false }], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't8', title: 'Profile identity menu banner', ongoing: false, day: '2026-04-27', priority: 'none', notes: '', subtasks: [{ id: 'st8a', text: 'Get approval on PR', done: false }, { id: 'st8b', text: 'Rollout', done: false }], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't9', title: 'Snapshot tests merge',        ongoing: false, day: '2026-04-27', priority: 'none', notes: 'Merge 1 today', subtasks: [{ id: 'st9a', text: 'PR 1', done: false }, { id: 'st9b', text: 'PR 2', done: false }], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't10',title: 'Schedule a call with Uriel',  ongoing: false, day: '2026-04-27', priority: 'none', notes: '', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't11',title: 'Summarize your achievements for Q1', ongoing: false, day: 'unscheduled', priority: 'none', notes: '', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
  ];

  let tasks = [];
  let weekOffset = 0;
  let editingId = null;
  let modalSubtasks = [];
  let modalLog = [];

  // ── Sync indicator ──────────────────────────────────────────
  const syncDot = document.getElementById('syncDot');
  let _syncClearTimer = null;
  function setSyncState(state) { // 'saving' | 'saved' | 'error' | ''
    syncDot.className = 'sync-dot' + (state ? ' ' + state : '');
    clearTimeout(_syncClearTimer);
    if (state === 'saved' || state === 'error') {
      _syncClearTimer = setTimeout(() => { syncDot.className = 'sync-dot'; }, 2000);
    }
  }

  function migrateTasks(raw) {
    return (raw || INITIAL_TASKS).map(t => {
      const base = { ongoing: false, subtasks: [], activeNow: false, blockedOn: '', prLink: '', noteHistory: [], claimedBy: '', ...t };
      // Derive status from done if not present
      if (!base.status) base.status = base.done ? 'done' : 'todo';
      // Keep done in sync with status
      base.done = base.status === 'done';
      return base;
    });
  }

  async function loadTasks() {
    try {
      const res = await fetch('/tasks');
      const data = await res.json();
      tasks = migrateTasks(data);
    } catch {
      const stored = localStorage.getItem(STORAGE_KEY);
      tasks = migrateTasks(stored ? JSON.parse(stored) : null);
    }
    renderBoard();
  }

  // Debounced save — coalesces rapid calls (e.g. quick subtask toggles) into one request
  let _saveTimer = null;
  function saveTasks() {
    clearTimeout(_saveTimer);
    setSyncState('saving');
    _saveTimer = setTimeout(_doSave, 300);
  }

  async function _doSave() {
    try {
      _sseIgnoreNext = true; // this tab already has the latest state
      await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(tasks),
      });
      setSyncState('saved');
    } catch {
      _sseIgnoreNext = false;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      setSyncState('error');
    }
  }

  function getWeekStart(offset = 0) {
    const now = new Date();
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7) + offset * 7);
    monday.setHours(0, 0, 0, 0);
    return monday;
  }

  function formatDate(d) {
    return d.toISOString().slice(0, 10);
  }

  function getWeekDates(offset = 0) {
    const mon = getWeekStart(offset);
    return Array.from({ length: 5 }, (_, i) => {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      return d;
    });
  }

  function getPrevWorkday(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6);
    return d;
  }

  function getDisplayDays(offset = 0) {
    const weekdays = getWeekDates(offset); // Mon–Fri
    if (offset !== 0) return weekdays;

    // On current week: prepend previous workday if it falls outside Mon–Fri range
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const prev = getPrevWorkday(today);
    const prevStr = formatDate(prev);
    const alreadyShown = weekdays.some(d => formatDate(d) === prevStr);
    return alreadyShown ? weekdays : [prev, ...weekdays];
  }

  function isToday(date) {
    return formatDate(date) === formatDate(new Date());
  }

  function isPast(date) {
    const d = new Date(date); d.setHours(0,0,0,0);
    const t = new Date(); t.setHours(0,0,0,0);
    return d < t;
  }

  function getDayName(date) {
    return date.toLocaleDateString('en-US', { weekday: 'long' });
  }

  function updateWeekLabel() {
    const dates = getWeekDates(weekOffset);
    const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    document.getElementById('weekLabel').textContent =
      `${fmt(dates[0])} – ${fmt(dates[4])}, ${dates[4].getFullYear()}`;
  }

  // ── Render ──────────────────────────────────────────────

  function addDropZone(el, targetDay) {
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (targetDay === 'ongoing') {
        task.ongoing = true;
        task.day = 'unscheduled';
      } else {
        task.ongoing = false;
        task.day = targetDay;
      }
      saveTasks();
      renderBoard();
    });
  }

  function renderBoard() {
    renderOngoingBand();

    const board = document.getElementById('board');
    board.innerHTML = '';
    const dates = getDisplayDays(weekOffset);

    dates.forEach((date) => {
      const dateStr = formatDate(date);
      const past = isPast(date) && !isToday(date);
      const dayTasks = tasks.filter(t => !t.ongoing && t.day === dateStr)
        .sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
      const pending = dayTasks.filter(t => !t.done).length;

      const col = document.createElement('div');
      col.className = 'column' + (past ? ' past' : '');

      const hdr = document.createElement('div');
      hdr.className = 'column-header' + (isToday(date) ? ' today' : '') + (past ? ' past' : '');
      hdr.innerHTML = `
        <div class="day-name">${getDayName(date)}${past ? ' <span class="past-tag">prev</span>' : ''}</div>
        <div class="day-date">${date.getDate()}</div>
        <div class="task-count">${pending} task${pending !== 1 ? 's' : ''}</div>`;

      const body = document.createElement('div');
      body.className = 'column-body';
      addDropZone(body, dateStr);

      if (dayTasks.length === 0) body.innerHTML = '<div class="empty-col">No tasks</div>';
      else dayTasks.forEach(t => body.appendChild(makeTaskCard(t)));

      const addBtn = makeAddBtn(() => openModal(null, dateStr));
      body.appendChild(addBtn);
      col.appendChild(hdr);
      col.appendChild(body);
      board.appendChild(col);
    });

    // Unscheduled column
    const unscheduled = tasks.filter(t => !t.ongoing && t.day === 'unscheduled')
      .sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
    const pending = unscheduled.filter(t => !t.done).length;

    const col = document.createElement('div');
    col.className = 'column unscheduled';

    const hdr = document.createElement('div');
    hdr.className = 'column-header';
    hdr.innerHTML = `
      <div class="day-name">Unscheduled</div>
      <div class="day-date">—</div>
      <div class="task-count">${pending} task${pending !== 1 ? 's' : ''}</div>`;

    const body = document.createElement('div');
    body.className = 'column-body';
    addDropZone(body, 'unscheduled');

    if (unscheduled.length === 0) body.innerHTML = '<div class="empty-col">No tasks</div>';
    else unscheduled.forEach(t => body.appendChild(makeTaskCard(t)));

    body.appendChild(makeAddBtn(() => openModal(null, 'unscheduled')));
    col.appendChild(hdr);
    col.appendChild(body);
    board.appendChild(col);

    // Set grid columns to match actual number of columns rendered
    board.style.gridTemplateColumns = `repeat(${dates.length + 1}, 1fr)`;

    updateWeekLabel();
  }

  function renderOngoingBand() {
    const ongoing = tasks.filter(t => t.ongoing);
    const band = document.getElementById('ongoingBand');
    const cardsEl = document.getElementById('ongoingCards');
    const countEl = document.getElementById('ongoingCount');

    if (ongoing.length === 0) { band.style.display = 'none'; return; }
    band.style.display = '';
    const pending = ongoing.filter(t => !t.done).length;
    countEl.textContent = `${pending} active`;
    cardsEl.innerHTML = '';
    ongoing.forEach(t => cardsEl.appendChild(makeOngoingCard(t)));
    addDropZone(cardsEl, 'ongoing');
  }

  function makeAddBtn(onClick) {
    const btn = document.createElement('button');
    btn.className = 'col-add-btn';
    btn.textContent = '+ Add task';
    btn.addEventListener('click', onClick);
    return btn;
  }

  const CHECK_SVG = `<svg width="9" height="9" viewBox="0 0 10 10" fill="none">
    <path d="M1.5 5L3.8 7.5L8.5 2.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

  function addDragHandlers(card, task) {
    card.draggable = true;
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', task.id);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));

    card.addEventListener('dragover', e => {
      e.preventDefault();
      const rect = card.getBoundingClientRect();
      const pos = e.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
      card.classList.toggle('drop-before', pos === 'before');
      card.classList.toggle('drop-after',  pos === 'after');
    });
    card.addEventListener('dragleave', e => {
      if (!card.contains(e.relatedTarget)) {
        card.classList.remove('drop-before', 'drop-after');
      }
    });
    card.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      const insertBefore = card.classList.contains('drop-before');
      card.classList.remove('drop-before', 'drop-after');

      const draggedId = e.dataTransfer.getData('text/plain');
      if (draggedId === task.id) return;

      const draggedTask = tasks.find(t => t.id === draggedId);
      if (!draggedTask) return;

      // Move dragged task to same column as target
      draggedTask.ongoing = task.ongoing;
      draggedTask.day = task.day;

      // Reorder in array
      const fromIdx = tasks.findIndex(t => t.id === draggedId);
      tasks.splice(fromIdx, 1);
      const toIdx = tasks.findIndex(t => t.id === task.id);
      tasks.splice(insertBefore ? toIdx : toIdx + 1, 0, draggedTask);

      saveTasks();
      renderBoard();
    });
  }

  function makeTaskCard(task) {
    const card = document.createElement('div');
    card.className = 'task-card' + (task.done ? ' done' : '');

    const { meta, extra } = buildMetaParts(task, false);

    const lastLog = task.log && task.log.length ? task.log[task.log.length - 1] : null;
    card.innerHTML = `
      <div class="task-top">
        <div class="task-checkbox">${CHECK_SVG}</div>
        <div class="task-title">${escHtml(task.title)}</div>
      </div>
      ${meta ? `<div class="task-meta">${meta}</div>` : ''}
      ${extra || ''}
      ${lastLog && !task.done ? `<div class="card-log-entry">${escHtml(lastLog.text)}</div>` : ''}
      ${task.subtasks && task.subtasks.length > 0 ? `<div class="card-subtasks"></div>` : ''}`;

    card.querySelector('.task-checkbox').addEventListener('click', e => {
      e.stopPropagation();
      task.done = !task.done;
      task.status = task.done ? 'done' : (task.status === 'done' ? 'todo' : task.status);
      task.lastUpdated = new Date().toISOString();
      saveTasks();
      renderBoard();
    });

    if (task.subtasks && task.subtasks.length > 0) {
      const stContainer = card.querySelector('.card-subtasks');
      task.subtasks.forEach(st => {
        const row = document.createElement('div');
        row.className = 'card-subtask';
        row.innerHTML = `
          <div class="card-st-box${st.done ? ' checked' : ''}">${CHECK_SVG}</div>
          <span class="card-st-text${st.done ? ' checked' : ''}">${escHtml(st.text)}</span>`;
        row.querySelector('.card-st-box').addEventListener('click', e => {
          e.stopPropagation();
          st.done = !st.done;
          saveTasks();
          renderBoard();
        });
        stContainer.appendChild(row);
      });
    }

    addDragHandlers(card, task);
    card.addEventListener('click', () => openModal(task));
    return card;
  }

  function makeOngoingCard(task) {
    const card = document.createElement('div');
    card.className = 'ongoing-card' + (task.done ? ' done' : '') + (task.activeNow ? ' active-now' : '');

    const { meta, extra } = buildMetaParts(task, true);

    card.innerHTML = `
      <div class="task-top">
        <div class="task-checkbox">${CHECK_SVG}</div>
        <div class="task-title">${escHtml(task.title)}</div>
      </div>
      ${meta ? `<div class="task-meta">${meta}</div>` : ''}
      ${extra || ''}
      <button class="active-dot-btn" title="Toggle working on this now">
        <div class="active-dot${task.activeNow ? ' on' : ''}"></div>
        <span class="active-dot-label">${task.activeNow ? 'Working on this now' : 'Mark as active'}</span>
      </button>`;

    card.querySelector('.task-checkbox').addEventListener('click', e => {
      e.stopPropagation();
      task.done = !task.done;
      task.status = task.done ? 'done' : (task.status === 'done' ? 'todo' : task.status);
      task.lastUpdated = new Date().toISOString();
      saveTasks();
      renderBoard();
    });

    card.querySelector('.active-dot-btn').addEventListener('click', e => {
      e.stopPropagation();
      task.activeNow = !task.activeNow;
      saveTasks();
      renderBoard();
    });

    addDragHandlers(card, task);
    card.addEventListener('click', () => openModal(task));
    return card;
  }

  function buildMetaParts(task, showProgress) {
    let meta = '';

    // Status badge (skip 'todo' — that's the default, no need to show it)
    if (task.status && task.status !== 'todo' && task.status !== 'done') {
      const label = { 'in-progress': 'In Progress', 'in-review': 'In Review', 'blocked': 'Blocked' }[task.status] || task.status;
      meta += `<span class="status-badge status-${task.status}">${label}</span>`;
    }
    if (task.priority && task.priority !== 'none') {
      meta += `<span class="priority-badge priority-${task.priority}">${task.priority}</span>`;
    }
    if (showProgress && task.subtasks && task.subtasks.length > 0) {
      const done = task.subtasks.filter(s => s.done).length;
      const total = task.subtasks.length;
      const allDone = done === total;
      meta += `<span class="subtask-progress${allDone ? ' all-done' : ''}">${done}/${total} done</span>`;
    }
    if (task.prLink && task.prLink.trim()) {
      meta += `<a class="pr-link" href="${escHtml(task.prLink)}" target="_blank" rel="noopener" title="${escHtml(task.prLink)}">🔗 PR</a>`;
    }
    if (task.jiraKey && task.jiraKey.trim()) {
      const jiraBase = window._jiraBaseUrl || 'https://jira.lyft.net';
      meta += `<a class="jira-badge" href="${jiraBase}/browse/${escHtml(task.jiraKey)}" target="_blank" rel="noopener">${escHtml(task.jiraKey)}</a>`;
    }
    if (task.claimedBy && task.claimedBy.trim()) {
      meta += `<span class="claimed-badge" title="Claimed by ${escHtml(task.claimedBy)}">🔒</span>`;
    }
    if (task.notes && task.notes.trim()) {
      meta += `<span class="has-notes-icon">📝</span>`;
    }

    // Blocked reason rendered below meta row
    let extra = '';
    if (task.status === 'blocked' && task.blockedOn && task.blockedOn.trim()) {
      extra = `<div class="blocked-reason">⛔ ${escHtml(task.blockedOn)}</div>`;
    }

    return { meta, extra };
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Modal ────────────────────────────────────────────────

  let isOngoing = false;

  function openModal(task, defaultDay = null) {
    editingId = task ? task.id : null;
    isOngoing = task ? !!task.ongoing : false;

    document.getElementById('modalTitle').textContent = task ? 'Edit Task' : 'New Task';
    document.getElementById('taskTitle').value = task ? task.title : '';
    document.getElementById('taskNotes').value = task ? (task.notes || '') : '';
    document.getElementById('taskPriority').value = task ? (task.priority || 'none') : 'none';
    document.getElementById('taskStatus').value = task ? (task.status || 'todo') : 'todo';
    document.getElementById('taskPrLink').value = task ? (task.prLink || '') : '';
    document.getElementById('taskBlockedOn').value = task ? (task.blockedOn || '') : '';
    updatePrLinkBtn();
    document.getElementById('deleteTaskBtn').style.display = task ? '' : 'none';

    // Jira key — load and fetch preview if set
    const jiraKeyEl = document.getElementById('taskJiraKey');
    const jiraPreviewEl = document.getElementById('jiraPreview');
    jiraKeyEl.value = task ? (task.jiraKey || '') : '';
    jiraPreviewEl.innerHTML = '';
    if (task && task.jiraKey) fetchJiraPreview(task.jiraKey);

    // Show/hide blockedOn field based on status
    updateBlockedOnVisibility();

    // Progress log
    modalLog = task && task.log ? [...task.log] : [];
    document.getElementById('logNewEntry').value = '';
    renderLogTimeline();

    // Ongoing toggle
    updateOngoingToggleUI();

    // Day select
    const daySelect = document.getElementById('taskDay');
    if (task && !task.ongoing) {
      daySelect.value = task.day === 'unscheduled' ? 'unscheduled' : dayIndexFromDateStr(task.day);
    } else if (defaultDay && defaultDay !== 'unscheduled') {
      daySelect.value = dayIndexFromDateStr(defaultDay);
    } else {
      daySelect.value = 'unscheduled';
    }
    daySelect.dataset.defaultDate = defaultDay || '';

    // Subtasks
    modalSubtasks = task && task.subtasks ? task.subtasks.map(s => ({ ...s })) : [];
    renderModalSubtasks();

    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('taskTitle').focus(), 50);
  }

  function updateBlockedOnVisibility() {
    const status = document.getElementById('taskStatus').value;
    document.getElementById('blockedOnRow').style.display = status === 'blocked' ? '' : 'none';
  }

  function renderLogTimeline() {
    const timeline = document.getElementById('logTimeline');
    const count = document.getElementById('logCount');
    count.textContent = modalLog.length;
    if (modalLog.length === 0) {
      timeline.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:4px 0">No entries yet — add one above to start tracking progress.</div>';
      return;
    }
    // Show most recent first
    const entries = [...modalLog].reverse();
    timeline.innerHTML = entries.map(e => {
      const d = new Date(e.date);
      const when = isNaN(d) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      return `<div class="log-entry">
        <div class="log-entry-dot"></div>
        <div class="log-entry-body">
          <div class="log-entry-date">${when}</div>
          <div class="log-entry-text">${escHtml(e.text)}</div>
        </div>
      </div>`;
    }).join('');
  }

  function updateOngoingToggleUI() {
    const toggle = document.getElementById('ongoingToggle');
    const dayRow = document.getElementById('dayPriorityRow');
    const daySelect = document.getElementById('taskDay');
    if (isOngoing) {
      toggle.classList.add('active');
      daySelect.disabled = true;
      dayRow.style.opacity = '0.4';
    } else {
      toggle.classList.remove('active');
      daySelect.disabled = false;
      dayRow.style.opacity = '';
    }
  }

  function renderModalSubtasks() {
    const list = document.getElementById('subtaskList');
    list.innerHTML = '';
    modalSubtasks.forEach((st, i) => {
      const item = document.createElement('div');
      item.className = 'subtask-item' + (st.done ? ' done-item' : '');
      item.innerHTML = `
        <input type="checkbox" class="st-check" ${st.done ? 'checked' : ''} />
        <input type="text" class="st-text" value="${escHtml(st.text)}" placeholder="Subtask..." />
        <button class="st-del" title="Remove">×</button>`;

      item.querySelector('.st-check').addEventListener('change', e => {
        modalSubtasks[i].done = e.target.checked;
        item.classList.toggle('done-item', e.target.checked);
        const textEl = item.querySelector('.st-text');
        textEl.style.textDecoration = e.target.checked ? 'line-through' : '';
        textEl.style.color = e.target.checked ? 'var(--done-text)' : '';
      });
      item.querySelector('.st-text').addEventListener('input', e => {
        modalSubtasks[i].text = e.target.value;
      });
      item.querySelector('.st-del').addEventListener('click', () => {
        modalSubtasks.splice(i, 1);
        renderModalSubtasks();
      });

      // Apply done style immediately
      if (st.done) {
        const textEl = item.querySelector('.st-text');
        textEl.style.textDecoration = 'line-through';
        textEl.style.color = 'var(--done-text)';
      }

      list.appendChild(item);
    });
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
    modalSubtasks = [];
  }

  function saveTask() {
    const title = document.getElementById('taskTitle').value.trim();
    if (!title) { document.getElementById('taskTitle').focus(); return; }

    const priority = document.getElementById('taskPriority').value;
    const notes = document.getElementById('taskNotes').value.trim();
    const subtasks = modalSubtasks.filter(s => s.text.trim()).map(s => ({ ...s, text: s.text.trim() }));

    let dayStr;
    if (isOngoing) {
      dayStr = 'unscheduled';
    } else {
      const dayVal = document.getElementById('taskDay').value;
      const defaultDate = document.getElementById('taskDay').dataset.defaultDate;
      if (dayVal === 'unscheduled') {
        dayStr = 'unscheduled';
      } else {
        const dayIndex = parseInt(dayVal);
        const dates = getWeekDates(weekOffset);
        if (editingId) {
          const existing = tasks.find(t => t.id === editingId);
          if (existing && existing.day !== 'unscheduled' && !existing.ongoing) {
            const ed = new Date(existing.day + 'T00:00:00');
            const mon = new Date(ed);
            mon.setDate(ed.getDate() - ((ed.getDay() + 6) % 7));
            mon.setHours(0, 0, 0, 0);
            const nd = new Date(mon);
            nd.setDate(mon.getDate() + dayIndex);
            dayStr = formatDate(nd);
          } else {
            dayStr = formatDate(dates[dayIndex]);
          }
        } else if (defaultDate && defaultDate !== 'unscheduled') {
          const dd = new Date(defaultDate + 'T00:00:00');
          const mon = new Date(dd);
          mon.setDate(dd.getDate() - ((dd.getDay() + 6) % 7));
          mon.setHours(0, 0, 0, 0);
          const nd = new Date(mon);
          nd.setDate(mon.getDate() + dayIndex);
          dayStr = formatDate(nd);
        } else {
          dayStr = formatDate(dates[dayIndex]);
        }
      }
    }

    const status   = document.getElementById('taskStatus').value;
    const prLink   = document.getElementById('taskPrLink').value.trim();
    const blockedOn = status === 'blocked' ? document.getElementById('taskBlockedOn').value.trim() : '';
    const jiraKey  = document.getElementById('taskJiraKey').value.trim().toUpperCase();
    const done     = status === 'done';

    setSyncState('saving');

    if (editingId) {
      const idx = tasks.findIndex(t => t.id === editingId);
      if (idx !== -1) {
        const prev = tasks[idx];
        const patch = {
          title, day: dayStr, priority, notes, ongoing: isOngoing, subtasks,
          status, done, prLink, blockedOn, jiraKey, log: modalLog,
          claimedBy: status === 'done' ? '' : prev.claimedBy,
          lastUpdated: new Date().toISOString(),
        };
        // Optimistic local update
        tasks[idx] = { ...prev, ...patch };
        // PATCH just this task — safe against concurrent agent writes
        fetch(`/tasks/${editingId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        }).then(() => setSyncState('saved')).catch(() => {
          // Fall back to full save
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          setSyncState('error');
        });
      }
    } else {
      const newTask = {
        title, day: dayStr, priority, notes,
        ongoing: isOngoing, subtasks,
        status, done, prLink, blockedOn, jiraKey, log: modalLog,
        createdAt: new Date().toISOString(),
        lastUpdated: new Date().toISOString(),
      };
      fetch('/tasks/new', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newTask),
      }).then(r => r.json()).then(data => {
        newTask.id = data.id;
        tasks.push(newTask);
        setSyncState('saved');
        renderBoard();
      }).catch(() => {
        newTask.id = Date.now().toString();
        tasks.push(newTask);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        setSyncState('error');
        renderBoard();
      });
    }

    closeModal();
    renderBoard();
  }

  function deleteTask() {
    if (!editingId) return;
    if (!confirm('Delete this task?')) return;
    tasks = tasks.filter(t => t.id !== editingId);
    saveTasks();
    closeModal();
    renderBoard();
  }

  function dayIndexFromDateStr(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return ((d.getDay() + 6) % 7).toString();
  }

  // ── Events ───────────────────────────────────────────────

  document.getElementById('openAddModal').addEventListener('click', () => openModal(null));
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('saveTask').addEventListener('click', saveTask);
  document.getElementById('deleteTaskBtn').addEventListener('click', deleteTask);
  document.getElementById('prevWeek').addEventListener('click', () => { weekOffset--; renderBoard(); });
  document.getElementById('nextWeek').addEventListener('click', () => { weekOffset++; renderBoard(); });
  document.getElementById('todayBtn').addEventListener('click', () => { weekOffset = 0; renderBoard(); });

  document.getElementById('ongoingToggle').addEventListener('click', () => {
    isOngoing = !isOngoing;
    updateOngoingToggleUI();
  });

  document.getElementById('taskStatus').addEventListener('change', updateBlockedOnVisibility);

  // PR link open button — show when there's a URL, update href as you type
  const prLinkInput = document.getElementById('taskPrLink');
  const prLinkOpen  = document.getElementById('prLinkOpen');
  function updatePrLinkBtn() {
    const url = prLinkInput.value.trim();
    const show = url.startsWith('http');
    prLinkOpen.style.display = show ? '' : 'none';
    if (show) prLinkOpen.href = url;
  }
  prLinkInput.addEventListener('input', updatePrLinkBtn);

  document.getElementById('logAddBtn').addEventListener('click', () => {
    const input = document.getElementById('logNewEntry');
    const text = input.value.trim();
    if (!text) return;
    modalLog.push({ date: new Date().toISOString(), text });
    input.value = '';
    input.style.height = '38px';
    renderLogTimeline();
  });

  document.getElementById('logNewEntry').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('logAddBtn').click();
    }
  });

  document.getElementById('addSubtaskBtn').addEventListener('click', () => {
    modalSubtasks.push({ id: 'st' + Date.now(), text: '', done: false });
    renderModalSubtasks();
    // Focus the new input
    const inputs = document.querySelectorAll('.st-text');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') saveTask();
  });

  // ── Global drag cleanup — removes stuck highlight classes ───
  function cleanupDragUI() {
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    document.querySelectorAll('.drop-before').forEach(el => el.classList.remove('drop-before'));
    document.querySelectorAll('.drop-after').forEach(el => el.classList.remove('drop-after'));
  }
  document.addEventListener('dragend', cleanupDragUI);
  document.addEventListener('drop', cleanupDragUI);

  // Live sync — reconnects automatically if the server restarts
  let _sseIgnoreNext = false;
  function connectSSE() {
    const es = new EventSource('/events');
    es.onmessage = () => {
      if (_sseIgnoreNext) { _sseIgnoreNext = false; return; }
      loadTasks();
    };
    es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
  }
  connectSSE();

  loadTasks();

  // ── Jira integration ──────────────────────────────────────────────────────
  window._jiraBaseUrl = 'https://jira.lyft.net';

  async function loadJiraConfig() {
    try {
      const res = await fetch('/jira-config');
      const data = await res.json();
      window._jiraBaseUrl = data.baseUrl || 'https://jira.lyft.net';
      document.getElementById('jiraDot').classList.toggle('on', data.configured);
      document.getElementById('jiraBaseUrl').value = data.baseUrl || 'https://jira.lyft.net';
    } catch (_) {}
  }
  loadJiraConfig();

  async function fetchJiraPreview(key) {
    if (!key || !/^[A-Z]+-\d+$/i.test(key.trim())) {
      document.getElementById('jiraPreview').innerHTML = '';
      return;
    }
    const preview = document.getElementById('jiraPreview');
    preview.innerHTML = '<span style="color:var(--text-muted)">Fetching…</span>';
    try {
      const res = await fetch(`/jira/${encodeURIComponent(key.trim().toUpperCase())}`);
      const data = await res.json();
      if (!res.ok) {
        preview.innerHTML = `<span style="color:var(--red)">${escHtml(data.error || 'Error')}</span>`;
        return;
      }
      const dotClass = { yellow: 'yellow', green: 'green', 'blue-grey': 'blue-grey' }[data.statusCategory] || 'blue-grey';
      const assigneeHtml = data.assignee ? `<span style="color:var(--text-muted)">· ${escHtml(data.assignee)}</span>` : '';
      preview.innerHTML = `
        <span class="jira-status-dot ${dotClass}"></span>
        <a href="${escHtml(data.url)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:500">${escHtml(data.summary)}</a>
        <span style="color:var(--text-muted)">[${escHtml(data.status)}]</span>
        ${assigneeHtml}
      `;
    } catch (e) {
      preview.innerHTML = `<span style="color:var(--red)">Could not reach Jira</span>`;
    }
  }

  // Debounce Jira key input
  let _jiraTimer = null;
  document.getElementById('taskJiraKey').addEventListener('input', e => {
    clearTimeout(_jiraTimer);
    const key = e.target.value.trim();
    if (!key) { document.getElementById('jiraPreview').innerHTML = ''; return; }
    _jiraTimer = setTimeout(() => fetchJiraPreview(key), 500);
  });

  // Jira settings modal
  const jiraModalOverlay = document.getElementById('jiraModalOverlay');
  document.getElementById('jiraConfigBtn').addEventListener('click', () => jiraModalOverlay.classList.add('open'));
  document.getElementById('jiraModalClose').addEventListener('click', () => jiraModalOverlay.classList.remove('open'));
  jiraModalOverlay.addEventListener('click', e => { if (e.target === jiraModalOverlay) jiraModalOverlay.classList.remove('open'); });

  document.getElementById('jiraModalSave').addEventListener('click', async () => {
    const token   = document.getElementById('jiraToken').value.trim();
    const baseUrl = document.getElementById('jiraBaseUrl').value.trim();
    if (!token && !baseUrl) { jiraModalOverlay.classList.remove('open'); return; }
    try {
      await fetch('/jira-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, baseUrl }),
      });
      document.getElementById('jiraToken').value = '';
      await loadJiraConfig();
      jiraModalOverlay.classList.remove('open');
    } catch (e) {
      alert('Could not save Jira config: ' + e);
    }
  });

  // ── Update button ──────────────────────────────────────────────────────────
  const updateBtn      = document.getElementById('updateBtn');
  const updateOverlay  = document.getElementById('updateOverlay');
  const updateTitle    = document.getElementById('updateTitle');
  const updateOutput   = document.getElementById('updateOutput');
  const updateCloseBtn = document.getElementById('updateCloseBtn');
  const updateRestartBtn = document.getElementById('updateRestartBtn');

  updateBtn.addEventListener('click', async () => {
    updateTitle.textContent = 'Checking for updates…';
    updateOutput.textContent = '';
    updateRestartBtn.style.display = 'none';
    updateOverlay.classList.add('open');
    updateBtn.classList.add('spinning');

    try {
      const res  = await fetch('/update', { method: 'POST' });
      const data = await res.json();

      updateBtn.classList.remove('spinning');
      updateOutput.textContent = data.output || '(no output)';

      if (!data.ok) {
        updateTitle.textContent = '⚠ Update failed';
      } else if (!data.changed) {
        updateTitle.textContent = '✓ Already up to date';
      } else if (data.server_changed) {
        updateTitle.textContent = '✓ Updated — restart required';
        updateRestartBtn.style.display = '';
      } else {
        updateTitle.textContent = '✓ Updated';
        // Reload tasks to pick up any UI changes
        setTimeout(loadTasks, 300);
      }
    } catch (e) {
      updateBtn.classList.remove('spinning');
      updateTitle.textContent = '⚠ Could not reach server';
      updateOutput.textContent = String(e);
    }
  });

  updateCloseBtn.addEventListener('click', () => updateOverlay.classList.remove('open'));
  updateOverlay.addEventListener('click', e => { if (e.target === updateOverlay) updateOverlay.classList.remove('open'); });

  updateRestartBtn.addEventListener('click', async () => {
    updateRestartBtn.disabled = true;
    updateRestartBtn.textContent = 'Restarting…';
    try {
      await fetch('/restart', { method: 'POST' });
      updateTitle.textContent = '↺ Restarting server…';
      updateOutput.textContent = 'Page will reload in a few seconds.';
      setTimeout(() => location.reload(), 4000);
    } catch (_) {
      // Expected — server went away mid-response
      updateTitle.textContent = '↺ Restarting…';
      updateOutput.textContent = 'Page will reload in a few seconds.';
      setTimeout(() => location.reload(), 4000);
    }
  });
</script>
</body>
</html>
