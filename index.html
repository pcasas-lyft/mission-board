<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1e1e2e;
      --surface: #313244;
      --surface2: #45475a;
      --border: #585b70;
      --accent: #89b4fa;
      --accent-dim: #5a7dcc;
      --text: #cdd6f4;
      --text-muted: #a6adc8;
      --done-text: #6c7086;
      --green: #a6e3a1;
      --red: #f38ba8;
      --yellow: #f9e2af;
      --purple: #cba6f7;
      --radius: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .week-nav { display: flex; align-items: center; gap: 10px; }
    .week-label { font-size: 13px; color: var(--text-muted); min-width: 160px; text-align: center; }
    .nav-btn, .add-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 7px; cursor: pointer;
      font-size: 14px; transition: background 0.15s;
    }
    .nav-btn { padding: 6px 11px; }
    .nav-btn:hover { background: var(--border); }
    .add-btn { background: var(--accent); border-color: var(--accent); color: #fff; padding: 7px 16px; font-weight: 600; }
    .add-btn:hover { background: #6a9de8; }

    /* ── Sync indicator ── */
    .sync-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted); flex-shrink: 0;
      transition: background 0.2s;
    }
    .sync-dot.saving  { background: var(--yellow); animation: pulse 0.8s infinite alternate; }
    .sync-dot.saved   { background: var(--green); }
    .sync-dot.error   { background: var(--red); }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.3; } }

    /* ── Ongoing band ── */
    .ongoing-band {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 14px;
    }
    .ongoing-band-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .ongoing-band-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--purple);
    }
    .ongoing-band-count {
      font-size: 11px; color: var(--text-muted);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 1px 7px;
    }
    .ongoing-band-cards {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px;
    }
    .ongoing-band-cards::-webkit-scrollbar { height: 4px; }
    .ongoing-band-cards::-webkit-scrollbar-track { background: transparent; }
    .ongoing-band-cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .ongoing-card {
      background: var(--surface2);
      border: 1px solid var(--purple);
      border-radius: var(--radius);
      padding: 10px 12px;
      min-width: 200px;
      max-width: 240px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .ongoing-card:hover { background: #3a3a54; }
    .ongoing-card.active-now { border-color: var(--green); background: rgba(74,222,128,0.06); }
    .ongoing-card.active-now:hover { background: rgba(74,222,128,0.1); }
    .ongoing-card.done { opacity: 0.5; }
    .ongoing-card.done .task-title { text-decoration: line-through; color: var(--done-text); }
    .ongoing-card .task-top { display: flex; align-items: flex-start; gap: 8px; }
    .ongoing-card .task-title { font-size: 13px; font-weight: 500; line-height: 1.4; flex: 1; word-break: break-word; }

    /* Active now indicator */
    .active-dot-btn {
      display: flex; align-items: center; gap: 5px;
      background: transparent; border: none; cursor: pointer;
      padding: 0; margin-top: 8px; width: 100%;
    }
    .active-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border); flex-shrink: 0; transition: background 0.2s;
    }
    .active-dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(74,222,128,0.2); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(74,222,128,0.3); }
      50%       { box-shadow: 0 0 0 5px rgba(74,222,128,0.08); }
    }
    .active-dot.on { animation: pulse 2s infinite; }
    .active-dot-label { font-size: 11px; color: var(--text-muted); transition: color 0.2s; }
    .active-dot-btn:hover .active-dot-label { color: var(--text); }
    .active-now .active-dot-label { color: var(--green); font-weight: 600; }

    /* ── Board ── */
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 1px;
      background: var(--border);
      min-height: calc(100vh - 120px);
    }
    .column { background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
    .column-header {
      padding: 12px 10px 8px;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
    }
    .column-header .day-name {
      font-weight: 700; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-muted);
    }
    .column-header.today .day-name { color: var(--accent); }
    .column-header .day-date { font-size: 20px; font-weight: 700; margin-top: 2px; line-height: 1; }
    .column-header.today .day-date { color: var(--accent); }
    .column-header .task-count { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .column-body { padding: 8px; flex: 1; }

    /* ── Task cards ── */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 11px;
      margin-bottom: 7px;
      cursor: grab;
      transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    }
    .task-card:hover { border-color: var(--accent-dim); background: var(--surface2); }
    .task-card.done { opacity: 0.5; }
    .task-card.done .task-title { text-decoration: line-through; color: var(--done-text); }
    .task-card.dragging, .ongoing-card.dragging { opacity: 0.3; cursor: grabbing; }

    .column-body.drag-over { background: rgba(137,180,250,0.07); outline: 2px dashed var(--accent-dim); outline-offset: -4px; border-radius: var(--radius); }
    .ongoing-band-cards.drag-over { outline: 2px dashed var(--purple); outline-offset: 2px; border-radius: var(--radius); background: rgba(192,132,252,0.07); }

    .task-card.drop-before { border-top: 2px solid var(--accent); margin-top: -1px; }
    .task-card.drop-after  { border-bottom: 2px solid var(--accent); }

    .task-top { display: flex; align-items: flex-start; gap: 7px; }
    .task-checkbox {
      width: 15px; height: 15px; border-radius: 4px;
      border: 2px solid var(--border); background: transparent;
      cursor: pointer; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .task-card.done .task-checkbox,
    .ongoing-card.done .task-checkbox { background: var(--green); border-color: var(--green); }
    .task-checkbox svg { display: none; }
    .task-card.done .task-checkbox svg,
    .ongoing-card.done .task-checkbox svg { display: block; }
    .task-title { font-size: 13px; font-weight: 500; line-height: 1.4; flex: 1; word-break: break-word; }

    .task-meta { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
    .priority-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 2px 5px; border-radius: 4px;
    }
    .priority-high { background: rgba(248,113,113,0.15); color: var(--red); }
    .priority-medium { background: rgba(251,191,36,0.15); color: var(--yellow); }
    .priority-low { background: rgba(74,222,128,0.12); color: var(--green); }

    .subtask-progress {
      font-size: 10px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); padding: 1px 6px; border-radius: 4px;
    }
    .subtask-progress.all-done { border-color: var(--green); color: var(--green); background: rgba(74,222,128,0.08); }
    .has-notes-icon { font-size: 11px; color: var(--text-muted); }

    /* ── Status left-border on cards ── */
    .task-card[data-status="in-progress"]    { border-left: 3px solid var(--accent); }
    .task-card[data-status="in-review"]      { border-left: 3px solid var(--yellow); }
    .task-card[data-status="blocked"]        { border-left: 3px solid var(--red); }
    .ongoing-card[data-status="in-progress"] { border-left: 3px solid var(--accent); }
    .ongoing-card[data-status="in-review"]   { border-left: 3px solid var(--yellow); }
    .ongoing-card[data-status="blocked"]     { border-left: 3px solid var(--red); }

    /* ── Done-tasks toggle ── */
    .done-toggle-btn {
      width: 100%; background: transparent; border: 1px dashed var(--border);
      border-radius: var(--radius); color: var(--done-text); font-size: 11px;
      padding: 5px; cursor: pointer; text-align: center; transition: all 0.15s;
      margin-top: 2px; font-family: inherit;
    }
    .done-toggle-btn:hover { border-color: var(--text-muted); color: var(--text-muted); }

    /* ── Modal details toggle ── */
    .details-toggle {
      display: flex; align-items: center; gap: 5px;
      background: none; border: none; color: var(--text-muted);
      font-size: 12px; padding: 0 0 14px; cursor: pointer;
      font-family: inherit; width: 100%; text-align: left; line-height: 1;
    }
    .details-toggle:hover { color: var(--accent); }
    .details-toggle .arr { font-size: 9px; transition: transform 0.15s; display: inline-block; }
    .details-toggle.open .arr { transform: rotate(90deg); }

    /* ── Status badges ── */
    .status-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 2px 6px; border-radius: 4px;
    }
    .status-in-progress { background: rgba(137,180,250,0.15); color: var(--accent); }
    .status-in-review   { background: rgba(251,191,36,0.15);  color: var(--yellow); }
    .status-blocked     { background: rgba(248,113,113,0.15); color: var(--red); }

    /* ── Blocked reason on card ── */
    .blocked-reason {
      font-size: 11px; color: var(--red);
      margin-top: 5px; padding: 3px 7px;
      background: rgba(248,113,113,0.07);
      border-radius: 4px; border-left: 2px solid var(--red);
    }

    /* ── PR link on card ── */
    .pr-link {
      font-size: 11px; color: var(--accent);
      text-decoration: none; display: inline-flex; align-items: center; gap: 3px;
    }
    .pr-link:hover { text-decoration: underline; }

    /* ── Progress log in modal ── */
    .log-section { margin-top: 18px; }
    .log-section-header {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .log-count {
      font-size: 10px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 1px 7px; text-transform: none; letter-spacing: 0;
    }
    .log-add-row {
      display: flex; gap: 7px; margin-bottom: 12px;
    }
    .log-add-row textarea {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px;
      padding: 8px 10px; outline: none; font-family: inherit;
      resize: none; height: 38px; line-height: 1.4;
      transition: border-color 0.15s, height 0.1s;
    }
    .log-add-row textarea:focus { border-color: var(--accent); height: 70px; }
    .log-add-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 8px; cursor: pointer;
      font-size: 12px; padding: 0 12px; white-space: nowrap;
      transition: background 0.15s, color 0.15s; align-self: flex-start; height: 38px;
    }
    .log-add-btn:hover { background: var(--border); color: var(--text); }
    .log-timeline { display: flex; flex-direction: column; gap: 0; }
    .log-entry {
      display: flex; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .log-entry:last-child { border-bottom: none; }
    .log-entry-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-dim); border: 2px solid var(--accent);
      flex-shrink: 0; margin-top: 5px;
    }
    .log-entry-body { flex: 1; min-width: 0; }
    .log-entry-date {
      font-size: 10px; color: var(--text-muted); margin-bottom: 2px;
    }
    .log-entry-text {
      font-size: 13px; color: var(--text); line-height: 1.45; word-break: break-word;
    }
    /* Most recent log entry shown on cards */
    .card-log-entry {
      font-size: 11px; color: var(--text-muted); margin-top: 5px;
      line-height: 1.35; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Inline subtasks on cards */
    .card-subtasks { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .card-subtask {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 0;
    }
    .card-st-box {
      width: 13px; height: 13px; border-radius: 3px;
      border: 1.5px solid var(--border); background: transparent;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; cursor: pointer;
    }
    .card-st-box.checked { background: var(--green); border-color: var(--green); }
    .card-st-box.checked svg { display: block; }
    .card-st-box svg { display: none; }
    .card-st-text {
      font-size: 12px; color: var(--text-muted); line-height: 1.3;
      flex: 1; word-break: break-word;
    }
    .card-st-text.checked { text-decoration: line-through; color: var(--done-text); }

    /* ── Parent badge on subtask cards ── */
    .parent-badge {
      font-size: 10px; color: var(--text-muted);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px; white-space: nowrap;
      max-width: 180px; overflow: hidden; text-overflow: ellipsis;
      display: inline-block; vertical-align: middle;
    }

    /* ── Day select in subtask list ── */
    .st-day {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text-muted); font-size: 11px;
      padding: 2px 4px; cursor: pointer; outline: none; flex-shrink: 0;
      font-family: inherit; max-width: 82px;
    }
    .st-day:focus { border-color: var(--accent); }
    .st-day option { background: var(--surface2); }

    .col-add-btn {
      width: 100%; background: transparent; border: 1px dashed var(--border);
      border-radius: var(--radius); color: var(--text-muted); font-size: 12px;
      padding: 7px; cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .col-add-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
    .empty-col { color: var(--text-muted); font-size: 12px; text-align: center; padding: 14px 6px; opacity: 0.6; }
    .column.unscheduled .column-header .day-name { color: var(--yellow); }
    .column.past { opacity: 0.7; }
    .column-header.past .day-name { color: var(--text-muted); }
    .past-tag {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); padding: 1px 4px; border-radius: 3px;
      vertical-align: middle; margin-left: 4px;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; width: 500px; max-width: 95vw; max-height: 90vh;
      overflow-y: auto; box-shadow: var(--shadow); padding: 26px;
    }
    .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; }

    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.6px;
      color: var(--text-muted); margin-bottom: 5px;
    }
    .form-group input:not(.st-text):not(.st-check),
    .form-group select,
    .form-group textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
      padding: 9px 11px; outline: none; font-family: inherit; transition: border-color 0.15s;
    }
    .form-group input:not(.st-text):not(.st-check):focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-group select option { background: var(--surface2); }
    .form-group input:not(.st-text):not(.st-check):disabled,
    .form-group select:disabled { opacity: 0.4; cursor: not-allowed; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Ongoing toggle */
    .toggle-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; cursor: pointer;
      margin-bottom: 15px; transition: border-color 0.15s;
    }
    .toggle-row:hover { border-color: var(--purple); }
    .toggle-row.active { border-color: var(--purple); background: rgba(192,132,252,0.08); }
    .toggle-knob {
      width: 32px; height: 18px; background: var(--border); border-radius: 9px;
      flex-shrink: 0; position: relative; transition: background 0.2s;
    }
    .toggle-knob::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-row.active .toggle-knob { background: var(--purple); }
    .toggle-row.active .toggle-knob::after { transform: translateX(14px); }
    .toggle-label { font-size: 13px; font-weight: 500; flex: 1; }
    .toggle-sublabel { font-size: 11px; color: var(--text-muted); }

    /* Subtasks */
    .subtask-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .subtask-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 10px;
    }
    .subtask-item.done-item .st-text { text-decoration: line-through; color: var(--done-text); }
    .st-check {
      width: 14px; height: 14px; accent-color: var(--green);
      cursor: pointer; flex-shrink: 0;
    }
    .subtask-item .st-text {
      flex: 1; min-width: 0; background: transparent; border: none; color: var(--text);
      font-size: 13px; font-family: inherit; outline: none; padding: 0;
    }
    .st-del {
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1;
      transition: color 0.15s;
    }
    .st-del:hover { color: var(--red); }
    .add-subtask-btn {
      background: transparent; border: 1px dashed var(--border);
      border-radius: 7px; color: var(--text-muted); font-size: 12px;
      padding: 6px 10px; cursor: pointer; width: 100%;
      text-align: left; transition: all 0.15s; font-family: inherit;
    }
    .add-subtask-btn:hover { border-color: var(--accent-dim); color: var(--accent); }

    .modal-actions {
      display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px;
    }
    .btn-cancel {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 16px;
      cursor: pointer; font-size: 14px;
    }
    .btn-cancel:hover { background: var(--border); }
    .btn-save {
      background: var(--accent); border: none; color: #1e1e2e;
      border-radius: 8px; padding: 8px 18px; cursor: pointer;
      font-size: 14px; font-weight: 700;
    }
    .btn-save:hover { background: #6a9de8; }
    .btn-delete {
      background: rgba(243,139,168,0.12); border: 1px solid rgba(243,139,168,0.25);
      color: var(--red); border-radius: 8px; padding: 8px 16px;
      cursor: pointer; font-size: 14px; margin-right: auto;
    }
    .btn-delete:hover { background: rgba(243,139,168,0.22); }

    /* ── Undo toast ── */
    .undo-toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 16px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: var(--shadow); z-index: 600;
      font-size: 13px; color: var(--text); white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .undo-toast.visible { opacity: 1; pointer-events: auto; }
    .undo-toast-msg { color: var(--text-muted); }
    .undo-toast-msg strong { color: var(--text); }
    .undo-action {
      background: var(--accent); border: none; color: #1e1e2e;

<script>
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const STORAGE_KEY = 'weekly-todos-v2';

  const INITIAL_TASKS = [
    { id: 't1', title: 'Refactor auth module',        ongoing: true,  day: 'unscheduled', priority: 'high', notes: 'In progress — unblocked after design review', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't2', title: 'Dark mode polish',             ongoing: true,  day: 'unscheduled', priority: 'none', notes: '', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't3', title: 'API rate limiting',            ongoing: false, day: 'unscheduled', priority: 'none', notes: '', subtasks: [{ id: 'st3a', text: 'Research token bucket approach', done: false }], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't4', title: 'Write onboarding docs',        ongoing: false, day: 'unscheduled', priority: 'none', notes: '', subtasks: [], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
    { id: 't5', title: 'Fix flaky E2E tests',          ongoing: false, day: 'unscheduled', priority: 'none', notes: '', subtasks: [{ id: 'st5a', text: 'Identify root cause', done: false }, { id: 'st5b', text: 'Open PR with fix', done: false }], done: false, createdAt: '2026-04-27T00:00:00.000Z' },
  ];

  let tasks = [];
  let weekOffset = 0;
  let editingId = null;
  let modalSubtasks = [];
  let modalLog = [];

  // ── Sync indicator ──────────────────────────────────────────
  const syncDot = document.getElementById('syncDot');
  let _syncClearTimer = null;
  function setSyncState(state) { // 'saving' | 'saved' | 'error' | ''
    syncDot.className = 'sync-dot' + (state ? ' ' + state : '');
    clearTimeout(_syncClearTimer);
    if (state === 'saved' || state === 'error') {
      _syncClearTimer = setTimeout(() => { syncDot.className = 'sync-dot'; }, 2000);
    }
  }

  function prLabel(url) {
    if (!url) return '';
    try {
      const m = url.match(/github\.com\/[^/]+\/([^/]+)\/pull\/(\d+)/i);
      if (m) return `${m[1]} #${m[2]}`;
      const u = new URL(url);
      return u.hostname.replace('www.', '') + (u.pathname.length > 1 ? u.pathname : '');
    } catch { return url.length > 32 ? url.slice(0, 30) + '…' : url; }
  }

  function migrateTasks(raw) {
    return (raw || INITIAL_TASKS).map(t => {
      const base = { ongoing: false, subtasks: [], activeNow: false, blockedOn: '',
                     prLink: '', prLinks: [], docs: [], noteHistory: [], claimedBy: '', ...t };
      if (!base.status) base.status = base.done ? 'done' : 'todo';
      base.done = base.status === 'done';
      // Migrate legacy prLink string into prLinks array
      if (base.prLink && base.prLink.trim()) {
        const url = base.prLink.trim();
        if (!base.prLinks.some(p => p.url === url)) {
          base.prLinks = [{ url, label: prLabel(url) }, ...base.prLinks];
        }
        base.prLink = '';
      }
      // Ensure all entries are well-formed and labelled
      base.prLinks = base.prLinks
        .filter(p => p && p.url && p.url.trim())
        .map(p => ({ url: p.url.trim(), label: p.label || prLabel(p.url) }));
      return base;
    });
  }

  async function loadTasks() {
    try {
      const res = await fetch('/tasks');
      const data = await res.json();
      tasks = migrateTasks(data);
    } catch {
      const stored = localStorage.getItem(STORAGE_KEY);
      tasks = migrateTasks(stored ? JSON.parse(stored) : null);
    }
    renderBoard();
  }

  // Debounced save — coalesces rapid calls (e.g. quick subtask toggles) into one request
  let _saveTimer = null;
  function saveTasks() {
    clearTimeout(_saveTimer);
    setSyncState('saving');
    _saveTimer = setTimeout(_doSave, 300);
  }

  async function _doSave() {
    try {
      _sseIgnoreNext = true; // this tab already has the latest state
      await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(tasks),
      });
      setSyncState('saved');
    } catch {
      _sseIgnoreNext = false;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      setSyncState('error');
    }
  }

  function getWeekStart(offset = 0) {
    const now = new Date();
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7) + offset * 7);
    monday.setHours(0, 0, 0, 0);
    return monday;
  }

  function formatDate(d) {
    return d.toISOString().slice(0, 10);
  }

  function getWeekDates(offset = 0) {
    const mon = getWeekStart(offset);
    return Array.from({ length: 5 }, (_, i) => {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      return d;
    });
  }

  function getPrevWorkday(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6);
    return d;
  }

  function getDisplayDays(offset = 0) {
    const weekdays = getWeekDates(offset); // Mon–Fri
    if (offset !== 0) return weekdays;

    // On current week: prepend previous workday if it falls outside Mon–Fri range
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const prev = getPrevWorkday(today);
    const prevStr = formatDate(prev);
    const alreadyShown = weekdays.some(d => formatDate(d) === prevStr);
    return alreadyShown ? weekdays : [prev, ...weekdays];
  }

  function isToday(date) {
    return formatDate(date) === formatDate(new Date());
  }

  function isPast(date) {
    const d = new Date(date); d.setHours(0,0,0,0);
    const t = new Date(); t.setHours(0,0,0,0);
    return d < t;
  }

  function getDayName(date) {
    return date.toLocaleDateString('en-US', { weekday: 'long' });
  }

  function updateWeekLabel() {
    const dates = getWeekDates(weekOffset);
    const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    document.getElementById('weekLabel').textContent =
      `${fmt(dates[0])} – ${fmt(dates[4])}, ${dates[4].getFullYear()}`;
  }

  // ── Render ──────────────────────────────────────────────

  function addDropZone(el, targetDay) {
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (targetDay === 'ongoing') {
        task.ongoing = true;
        task.day = 'unscheduled';
      } else {
        task.ongoing = false;
        task.day = targetDay;
      }
      saveTasks();
      renderBoard();
    });
  }

  function makeDoneToggle(count, renderItems) {
    const wrapper = document.createElement('div');
    const btn = document.createElement('button');
    btn.className = 'done-toggle-btn';
    btn.textContent = `↓ ${count} done`;
    const container = document.createElement('div');
    container.style.display = 'none';
    let rendered = false;
    btn.addEventListener('click', () => {
      const hidden = container.style.display === 'none';
      if (hidden && !rendered) { renderItems(container); rendered = true; }
      container.style.display = hidden ? '' : 'none';
      btn.textContent = hidden ? '↑ Hide done' : `↓ ${count} done`;
    });
    wrapper.appendChild(btn);
    wrapper.appendChild(container);
    return wrapper;
  }

  function renderBoard() {
    renderOngoingBand();

    const board = document.getElementById('board');
    board.innerHTML = '';
    const dates = getDisplayDays(weekOffset);

    dates.forEach((date) => {
      const dateStr = formatDate(date);
      const past = isPast(date) && !isToday(date);
      const dayTasks = tasks.filter(t => !t.ongoing && t.day === dateStr)
        .sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));

      // Scheduled subtasks from ongoing tasks for this day
      const scheduledSubs = [];
      tasks.filter(t => t.ongoing && t.subtasks && t.subtasks.length).forEach(parentTask => {
        parentTask.subtasks.forEach(st => {
          if (st.day === dateStr) scheduledSubs.push({ subtask: st, parentTask });
        });
      });
      scheduledSubs.sort((a, b) => (a.subtask.done ? 1 : 0) - (b.subtask.done ? 1 : 0));

      const pendingTasks = dayTasks.filter(t => !t.done).length;
      const pendingSubs  = scheduledSubs.filter(({subtask}) => !subtask.done).length;
      const pending = pendingTasks + pendingSubs;

      const col = document.createElement('div');
      col.className = 'column' + (past ? ' past' : '');

      const hdr = document.createElement('div');
      hdr.className = 'column-header' + (isToday(date) ? ' today' : '') + (past ? ' past' : '');
      hdr.innerHTML = `
        <div class="day-name">${getDayName(date)}${past ? ' <span class="past-tag">prev</span>' : ''}</div>
        <div class="day-date">${date.getDate()}</div>
        <div class="task-count">${pending} task${pending !== 1 ? 's' : ''}</div>`;

      const body = document.createElement('div');
      body.className = 'column-body';
      addDropZone(body, dateStr);

      const activeDayTasks = past ? dayTasks : dayTasks.filter(t => !t.done);
      const doneDayTasks   = past ? [] : dayTasks.filter(t => t.done);
      const activeSubs     = past ? scheduledSubs : scheduledSubs.filter(({subtask}) => !subtask.done);
      const doneSubs       = past ? [] : scheduledSubs.filter(({subtask}) => subtask.done);
      const doneCount      = doneDayTasks.length + doneSubs.length;

      if (activeDayTasks.length === 0 && activeSubs.length === 0 && doneCount === 0) {
        body.innerHTML = '<div class="empty-col">No tasks</div>';
      } else {
        activeDayTasks.forEach(t => body.appendChild(makeTaskCard(t)));
        activeSubs.forEach(({subtask, parentTask}) => body.appendChild(makeSubtaskMiniCard(subtask, parentTask)));
        if (doneCount > 0) {
          body.appendChild(makeDoneToggle(doneCount, container => {
            doneDayTasks.forEach(t => container.appendChild(makeTaskCard(t)));
            doneSubs.forEach(({subtask, parentTask}) => container.appendChild(makeSubtaskMiniCard(subtask, parentTask)));
          }));
        }
      }

      const addBtn = makeAddBtn(() => openModal(null, dateStr));
      body.appendChild(addBtn);
      col.appendChild(hdr);
      col.appendChild(body);
      board.appendChild(col);
    });

    // Unscheduled column
    const unscheduled = tasks.filter(t => !t.ongoing && t.day === 'unscheduled')
      .sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
    const pending = unscheduled.filter(t => !t.done).length;

    const col = document.createElement('div');
    col.className = 'column unscheduled';

    const hdr = document.createElement('div');
    hdr.className = 'column-header';
    hdr.innerHTML = `
      <div class="day-name">Unscheduled</div>
      <div class="day-date">—</div>
      <div class="task-count">${pending} task${pending !== 1 ? 's' : ''}</div>`;

    const body = document.createElement('div');
    body.className = 'column-body';
    addDropZone(body, 'unscheduled');

    const activeUnscheduled = unscheduled.filter(t => !t.done);
    const doneUnscheduled   = unscheduled.filter(t => t.done);
    if (activeUnscheduled.length === 0 && doneUnscheduled.length === 0) {
      body.innerHTML = '<div class="empty-col">No tasks</div>';
    } else {
      activeUnscheduled.forEach(t => body.appendChild(makeTaskCard(t)));
      if (doneUnscheduled.length > 0) {
        body.appendChild(makeDoneToggle(doneUnscheduled.length, container => {
          doneUnscheduled.forEach(t => container.appendChild(makeTaskCard(t)));
        }));
      }
    }

    body.appendChild(makeAddBtn(() => openModal(null, 'unscheduled')));
    col.appendChild(hdr);
    col.appendChild(body);
    board.appendChild(col);

    // Set grid columns to match actual number of columns rendered
    board.style.gridTemplateColumns = `repeat(${dates.length + 1}, 1fr)`;

    updateWeekLabel();
  }

  function renderOngoingBand() {
    const ongoing = tasks.filter(t => t.ongoing);
    const band = document.getElementById('ongoingBand');
    const cardsEl = document.getElementById('ongoingCards');
    const countEl = document.getElementById('ongoingCount');

    if (ongoing.length === 0) { band.style.display = 'none'; return; }
    band.style.display = '';
    const pending = ongoing.filter(t => !t.done).length;
    countEl.textContent = `${pending} active`;
    cardsEl.innerHTML = '';
    ongoing.forEach(t => cardsEl.appendChild(makeOngoingCard(t)));
    addDropZone(cardsEl, 'ongoing');
  }

  function makeAddBtn(onClick) {
    const btn = document.createElement('button');
    btn.className = 'col-add-btn';
    btn.textContent = '+ Add task';
    btn.addEventListener('click', onClick);
    return btn;
  }

  const CHECK_SVG = `<svg width="9" height="9" viewBox="0 0 10 10" fill="none">
    <path d="M1.5 5L3.8 7.5L8.5 2.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

  function addDragHandlers(card, task) {
    card.draggable = true;
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', task.id);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));

    card.addEventListener('dragover', e => {
      e.preventDefault();
      const rect = card.getBoundingClientRect();
      const pos = e.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
      card.classList.toggle('drop-before', pos === 'before');
      card.classList.toggle('drop-after',  pos === 'after');
    });
    card.addEventListener('dragleave', e => {
      if (!card.contains(e.relatedTarget)) {
        card.classList.remove('drop-before', 'drop-after');
      }
    });
    card.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      const insertBefore = card.classList.contains('drop-before');
      card.classList.remove('drop-before', 'drop-after');

      const draggedId = e.dataTransfer.getData('text/plain');
      if (draggedId === task.id) return;

      const draggedTask = tasks.find(t => t.id === draggedId);
      if (!draggedTask) return;

      // Move dragged task to same column as target
      draggedTask.ongoing = task.ongoing;
      draggedTask.day = task.day;

      // Reorder in array
      const fromIdx = tasks.findIndex(t => t.id === draggedId);
      tasks.splice(fromIdx, 1);
      const toIdx = tasks.findIndex(t => t.id === task.id);
      tasks.splice(insertBefore ? toIdx : toIdx + 1, 0, draggedTask);

      saveTasks();
      renderBoard();
    });
  }

  function makeTaskCard(task) {
    const card = document.createElement('div');
    card.className = 'task-card' + (task.done ? ' done' : '');
    card.dataset.status = task.status || 'todo';

    const { meta, extra } = buildMetaParts(task, false);

    const lastLog = task.log && task.log.length ? task.log[task.log.length - 1] : null;
    card.innerHTML = `
      <div class="task-top">
        <div class="task-checkbox">${CHECK_SVG}</div>
        <div class="task-title">${escHtml(task.title)}</div>
      </div>
      ${meta ? `<div class="task-meta">${meta}</div>` : ''}
      ${extra || ''}
      ${lastLog && !task.done ? `<div class="card-log-entry">${escHtml(lastLog.text)}</div>` : ''}
      ${task.subtasks && task.subtasks.length > 0 ? `<div class="card-subtasks"></div>` : ''}`;

    card.querySelector('.task-checkbox').addEventListener('click', e => {
      e.stopPropagation();
      task.done = !task.done;
      task.status = task.done ? 'done' : (task.status === 'done' ? 'todo' : task.status);
      task.lastUpdated = new Date().toISOString();
      saveTasks();
      renderBoard();
    });

    if (task.subtasks && task.subtasks.length > 0) {
      const stContainer = card.querySelector('.card-subtasks');
      task.subtasks.forEach(st => {
        const row = document.createElement('div');
        row.className = 'card-subtask';
        row.innerHTML = `
          <div class="card-st-box${st.done ? ' checked' : ''}">${CHECK_SVG}</div>
          <span class="card-st-text${st.done ? ' checked' : ''}">${escHtml(st.text)}</span>`;
        row.querySelector('.card-st-box').addEventListener('click', e => {
          e.stopPropagation();
          st.done = !st.done;
          saveTasks();
          renderBoard();
        });
        stContainer.appendChild(row);
      });
    }

    addDragHandlers(card, task);
    card.addEventListener('click', () => openModal(task));
    return card;
  }

  function makeOngoingCard(task) {
    const card = document.createElement('div');
    card.className = 'ongoing-card' + (task.done ? ' done' : '') + (task.activeNow ? ' active-now' : '');
    card.dataset.status = task.status || 'todo';

    const { meta, extra } = buildMetaParts(task, true);

    card.innerHTML = `
      <div class="task-top">
        <div class="task-checkbox">${CHECK_SVG}</div>
        <div class="task-title">${escHtml(task.title)}</div>
      </div>
      ${meta ? `<div class="task-meta">${meta}</div>` : ''}
      ${extra || ''}
      <button class="active-dot-btn" title="Toggle working on this now">
        <div class="active-dot${task.activeNow ? ' on' : ''}"></div>
        <span class="active-dot-label">${task.activeNow ? 'Working on this now' : 'Mark as active'}</span>
      </button>`;

    card.querySelector('.task-checkbox').addEventListener('click', e => {
      e.stopPropagation();
      task.done = !task.done;
      task.status = task.done ? 'done' : (task.status === 'done' ? 'todo' : task.status);
      task.lastUpdated = new Date().toISOString();
      saveTasks();
      renderBoard();
    });

    card.querySelector('.active-dot-btn').addEventListener('click', e => {
      e.stopPropagation();
      task.activeNow = !task.activeNow;
      saveTasks();
      renderBoard();
    });

    addDragHandlers(card, task);
    card.addEventListener('click', () => openModal(task));
    return card;
  }

  function makeSubtaskMiniCard(subtask, parentTask) {
    const card = document.createElement('div');
    card.className = 'task-card' + (subtask.done ? ' done' : '');
    card.dataset.status = subtask.done ? 'done' : 'todo';

    card.innerHTML = `
      <div class="task-top">
        <div class="task-checkbox">${CHECK_SVG}</div>
        <div class="task-title">${escHtml(subtask.text)}</div>
      </div>
      <div class="task-meta">
        <span class="parent-badge">↳ ${escHtml(parentTask.title)}</span>
      </div>`;

    card.querySelector('.task-checkbox').addEventListener('click', e => {
      e.stopPropagation();
      subtask.done = !subtask.done;
      parentTask.lastUpdated = new Date().toISOString();
      saveTasks();
      renderBoard();
    });

    card.addEventListener('click', () => openModal(parentTask));
    return card;
  }

  function buildMetaParts(task, showProgress) {
    let meta = '';

    // Status badge (skip 'todo' — that's the default, no need to show it)
    if (task.status && task.status !== 'todo' && task.status !== 'done') {
      const label = { 'in-progress': 'In Progress', 'in-review': 'In Review', 'blocked': 'Blocked' }[task.status] || task.status;
      meta += `<span class="status-badge status-${task.status}">${label}</span>`;
    }
    if (task.priority && task.priority !== 'none') {
      meta += `<span class="priority-badge priority-${task.priority}">${task.priority}</span>`;
    }
    if (showProgress && task.subtasks && task.subtasks.length > 0) {
      const done = task.subtasks.filter(s => s.done).length;
      const total = task.subtasks.length;
      const allDone = done === total;
      meta += `<span class="subtask-progress${allDone ? ' all-done' : ''}">${done}/${total} done</span>`;
    }
    if (task.specLink && task.specLink.trim()) {
      const sl = task.specLink.trim();
      if (/^https?:\/\//i.test(sl)) {
        meta += `<a class="pr-link" href="${escHtml(sl)}" target="_blank" rel="noopener" title="${escHtml(sl)}">📋 Spec</a>`;
      } else {
        meta += `<button class="pr-link" style="border:none;cursor:pointer;background:none" onclick="openSpecPanel('${escHtml(sl)}');event.stopPropagation()">📋 Spec</button>`;
      }
    }
    const prs = (task.prLinks && task.prLinks.length)
      ? task.prLinks
      : (task.prLink ? [{ url: task.prLink, label: prLabel(task.prLink) }] : []);
    prs.filter(p => /^https?:\/\//i.test(p.url)).forEach(p => {
      meta += `<a class="pr-link" href="${escHtml(p.url)}" target="_blank" rel="noopener" title="${escHtml(p.url)}">${escHtml(p.label || '🔗 PR')}</a>`;
    });
    if (task.docs && task.docs.length) {
      const icon = { gdoc:'📄', gsheet:'📊', gslides:'📊', figma:'🎨', confluence:'📝', jira:'🎫', notion:'📓', quip:'📓' };
      task.docs.forEach(d => {
        if (!d.url) return;
        const ico = icon[d.type] || '📎';
        meta += `<a class="pr-link" href="${escHtml(d.url)}" target="_blank" rel="noopener" title="${escHtml(d.title || d.url)}">${ico}</a>`;
      });
    }
    if (task.jiraKey && task.jiraKey.trim()) {
      const jiraBase = /^https?:\/\//i.test(window._jiraBaseUrl || '') ? window._jiraBaseUrl : '';
      if (jiraBase) {
        meta += `<a class="jira-badge" href="${escHtml(jiraBase)}/browse/${escHtml(task.jiraKey)}" target="_blank" rel="noopener">${escHtml(task.jiraKey)}</a>`;
      } else {
        meta += `<span class="jira-badge">${escHtml(task.jiraKey)}</span>`;
      }
    }
    if (task.claimedBy && task.claimedBy.trim()) {
      meta += `<span class="claimed-badge" title="Claimed by ${escHtml(task.claimedBy)}">🔒</span>`;
    }
    if (task.notes && task.notes.trim()) {
      meta += `<span class="has-notes-icon">📝</span>`;
    }

    // Blocked reason rendered below meta row
    let extra = '';
    if (task.status === 'blocked' && task.blockedOn && task.blockedOn.trim()) {
      extra = `<div class="blocked-reason">⛔ ${escHtml(task.blockedOn)}</div>`;
    }

    return { meta, extra };
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Modal ────────────────────────────────────────────────

  let isOngoing = false;

  function openModal(task, defaultDay = null) {
    editingId = task ? task.id : null;
    isOngoing = task ? !!task.ongoing : false;

    document.getElementById('modalTitle').textContent = task ? 'Edit Task' : 'New Task';
    document.getElementById('taskTitle').value = task ? task.title : '';
    document.getElementById('taskNotes').value = task ? (task.notes || '') : '';
    document.getElementById('taskPriority').value = task ? (task.priority || 'none') : 'none';
    document.getElementById('taskStatus').value = task ? (task.status || 'todo') : 'todo';
    modalPrLinks = task ? [...(task.prLinks || [])] : [];
    renderModalPrLinks();
    modalDocs = task ? [...(task.docs || [])] : [];
    renderModalDocs();
    document.getElementById('taskSpecLink').value = task ? (task.specLink || '') : '';
    document.getElementById('taskBlockedOn').value = task ? (task.blockedOn || '') : '';
    updateSpecLinkBtn();
    document.getElementById('deleteTaskBtn').style.display = task ? '' : 'none';

    // Jira key — load and fetch preview if set
    const jiraKeyEl = document.getElementById('taskJiraKey');
    const jiraPreviewEl = document.getElementById('jiraPreview');
    jiraKeyEl.value = task ? (task.jiraKey || '') : '';
    jiraPreviewEl.innerHTML = '';
    if (task && task.jiraKey) fetchJiraPreview(task.jiraKey);

    // Show/hide blockedOn field based on status
    updateBlockedOnVisibility();

    // Progress log
    modalLog = task && task.log ? [...task.log] : [];
    document.getElementById('logNewEntry').value = '';
    renderLogTimeline();

    // Ongoing toggle
    updateOngoingToggleUI();

    // Day select
    const daySelect = document.getElementById('taskDay');
    if (task && !task.ongoing) {
      daySelect.value = task.day === 'unscheduled' ? 'unscheduled' : dayIndexFromDateStr(task.day);
    } else if (defaultDay && defaultDay !== 'unscheduled') {
      daySelect.value = dayIndexFromDateStr(defaultDay);
    } else {
      daySelect.value = 'unscheduled';
    }
    daySelect.dataset.defaultDate = defaultDay || '';

    // Subtasks
    modalSubtasks = task && task.subtasks ? task.subtasks.map(s => ({ ...s })) : [];
    renderModalSubtasks();

    // Parent task picker — list all other tasks (prefer ongoing at top)
    const parentSelect = document.getElementById('parentTaskSelect');
    parentSelect.innerHTML = '<option value="">— Keep as standalone task —</option>';
    const parentRow = document.getElementById('parentTaskRow');
    const candidates = tasks.filter(t => t.id !== (task && task.id));
    candidates.sort((a, b) => (b.ongoing ? 1 : 0) - (a.ongoing ? 1 : 0));
    candidates.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = (t.ongoing ? '🗓 ' : '') + t.title;
      parentSelect.appendChild(opt);
    });
    parentRow.style.display = candidates.length ? '' : 'none';

    // Details section: collapsed for new tasks, expanded for edits
    const detailsSection = document.getElementById('detailsSection');
    const detailsToggle  = document.getElementById('detailsToggle');
    if (task) {
      detailsSection.style.display = '';
      detailsToggle.classList.add('open');
    } else {
      detailsSection.style.display = 'none';
      detailsToggle.classList.remove('open');
    }

    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('taskTitle').focus(), 50);
  }

  function updateBlockedOnVisibility() {
    const status = document.getElementById('taskStatus').value;
    document.getElementById('blockedOnRow').style.display = status === 'blocked' ? '' : 'none';
  }

  function renderLogTimeline() {
    const timeline = document.getElementById('logTimeline');
    const count = document.getElementById('logCount');
    count.textContent = modalLog.length;
    if (modalLog.length === 0) {
      timeline.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:4px 0">No entries yet — add one above to start tracking progress.</div>';
      return;
    }
    // Show most recent first
    const entries = [...modalLog].reverse();
    timeline.innerHTML = entries.map(e => {
      const d = new Date(e.date);
      const when = isNaN(d) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      return `<div class="log-entry">
        <div class="log-entry-dot"></div>
        <div class="log-entry-body">
          <div class="log-entry-date">${when}</div>
          <div class="log-entry-text">${escHtml(e.text)}</div>
        </div>
      </div>`;
    }).join('');
  }

  function updateOngoingToggleUI() {
    const toggle = document.getElementById('ongoingToggle');
    const dayRow = document.getElementById('dayPriorityRow');
    const daySelect = document.getElementById('taskDay');
    if (isOngoing) {

  function saveTask() {
    const title = document.getElementById('taskTitle').value.trim();
    if (!title) { document.getElementById('taskTitle').focus(); return; }

    const priority = document.getElementById('taskPriority').value;
    const notes = document.getElementById('taskNotes').value.trim();
    const subtasks = modalSubtasks.filter(s => s.text.trim()).map(s => ({ ...s, text: s.text.trim() }));

    let dayStr;
    if (isOngoing) {
      dayStr = 'unscheduled';
    } else {
      const dayVal = document.getElementById('taskDay').value;
      const defaultDate = document.getElementById('taskDay').dataset.defaultDate;
      if (dayVal === 'unscheduled') {
        dayStr = 'unscheduled';
      } else {
        const dayIndex = parseInt(dayVal);
        const dates = getWeekDates(weekOffset);
        if (editingId) {
          const existing = tasks.find(t => t.id === editingId);
          if (existing && existing.day !== 'unscheduled' && !existing.ongoing) {
            const ed = new Date(existing.day + 'T00:00:00');
            const mon = new Date(ed);
            mon.setDate(ed.getDate() - ((ed.getDay() + 6) % 7));
            mon.setHours(0, 0, 0, 0);
            const nd = new Date(mon);
            nd.setDate(mon.getDate() + dayIndex);
            dayStr = formatDate(nd);
          } else {
            dayStr = formatDate(dates[dayIndex]);
          }
        } else if (defaultDate && defaultDate !== 'unscheduled') {
          const dd = new Date(defaultDate + 'T00:00:00');
          const mon = new Date(dd);
          mon.setDate(dd.getDate() - ((dd.getDay() + 6) % 7));
          mon.setHours(0, 0, 0, 0);
          const nd = new Date(mon);
          nd.setDate(mon.getDate() + dayIndex);
          dayStr = formatDate(nd);
        } else {
          dayStr = formatDate(dates[dayIndex]);
        }
      }
    }

    const status   = document.getElementById('taskStatus').value;
    const prLinks  = modalPrLinks.filter(p => p.url && p.url.trim())
                       .map(p => ({ url: p.url.trim(), label: p.label || prLabel(p.url.trim()) }));
    const prLink   = prLinks.length ? prLinks[0].url : ''; // kept for agent backward-compat
    const docs     = modalDocs.filter(d => d.url);
    const specLink = document.getElementById('taskSpecLink').value.trim();
    const blockedOn = status === 'blocked' ? document.getElementById('taskBlockedOn').value.trim() : '';
    const jiraKey  = document.getElementById('taskJiraKey').value.trim().toUpperCase();
    const done     = status === 'done';
    const parentTaskId = document.getElementById('parentTaskSelect').value;

    // ── Convert to subtask of another task ──────────────────
    if (parentTaskId) {
      const parentTask = tasks.find(t => t.id === parentTaskId);
      if (parentTask) {
        const newSub = {
          id: 'st' + Date.now(),
          text: title,
          done,
          ...(dayStr && dayStr !== 'unscheduled' ? { day: dayStr } : {}),
        };
        parentTask.subtasks = [...(parentTask.subtasks || []), newSub];
        parentTask.lastUpdated = new Date().toISOString();
        if (editingId) tasks = tasks.filter(t => t.id !== editingId);
        fetch(`/tasks/${parentTaskId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subtasks: parentTask.subtasks, lastUpdated: parentTask.lastUpdated }),
        });
        saveTasks();
        closeModal();
        renderBoard();
        return;
      }
    }

    setSyncState('saving');

    if (editingId) {
      const idx = tasks.findIndex(t => t.id === editingId);
      if (idx !== -1) {
        const prev = tasks[idx];
        const patch = {
          title, day: dayStr, priority, notes, ongoing: isOngoing, subtasks,
          status, done, prLink, prLinks, docs, specLink, blockedOn, jiraKey, log: modalLog,
          claimedBy: status === 'done' ? '' : prev.claimedBy,
          lastUpdated: new Date().toISOString(),
        };
        // Optimistic local update
        tasks[idx] = { ...prev, ...patch };
        // PATCH just this task — safe against concurrent agent writes
        fetch(`/tasks/${editingId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        }).then(() => setSyncState('saved')).catch(() => {
          // Fall back to full save
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          setSyncState('error');
        });
      }
    } else {
      const newTask = {
        id: `tmp-${Date.now()}`,   // optimistic id — replaced by server response
        title, day: dayStr, priority, notes,
        ongoing: isOngoing, subtasks,
        status, done, prLink, prLinks, docs, specLink, blockedOn, jiraKey, log: modalLog,
        createdAt: new Date().toISOString(),
        lastUpdated: new Date().toISOString(),
      };
      tasks.push(newTask);    // show it immediately
      closeModal();
      renderBoard();
      fetch('/tasks/new', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newTask),
      }).then(r => r.json()).then(data => {
        newTask.id = data.id;  // swap tmp id for the real one in-place
        setSyncState('saved');
        renderBoard();         // re-render with real id so clicks work
      }).catch(() => {
        // keep the tmp id — task is visible, just not server-confirmed
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        setSyncState('error');
      });
      return; // early return — closeModal/renderBoard already called above
    }

    // Edit path falls through here
    closeModal();
    renderBoard();
  }

  let _undoState = null;
  let _undoTimer = null;

  async function deleteTask() {
    if (!editingId) return;
    const idx = tasks.findIndex(t => t.id === editingId);
    if (idx === -1) return;
    const deleted = tasks[idx];
    const deletedId = editingId;

    // Optimistic local update first so the UI feels instant
    _undoState = { task: deleted, index: idx };
    tasks.splice(idx, 1);
    closeModal();
    renderBoard();
    showUndoToast(`Deleted "<strong>${escHtml(deleted.title)}</strong>"`);

    // Atomic server-side delete — no full-array POST needed
    try {
      _sseIgnoreNext = true;
      const res = await fetch(`/tasks/${deletedId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('delete failed');
      setSyncState('saved');
    } catch {
      // Server rejected it — roll back the optimistic update
      tasks.splice(idx, 0, deleted);
      _undoState = null;
      hideUndoToast();
      renderBoard();
      setSyncState('error');
    }
  }

        headers: { 'Content-Type': 'application/json' },

          : (t.prLink ? [{ url: t.prLink, label: prLabel(t.prLink) }] : []);
        const prHtml = prs.filter(p => /^https?:\/\//i.test(p.url))
          .map(p => `<a href="${escHtml(p.url)}" target="_blank" rel="noopener" style="color:var(--accent);font-size:11px">${escHtml(p.label || 'PR')}</a>`)
          .join(' · ');
        const notes = (t.notes || '').trim().split('\n')[0];
        return `<div class="archive-item">
          <div class="archive-title">${escHtml(t.title)}</div>
          <div class="archive-meta">${date}${prHtml ? ' · ' + prHtml : ''}</div>
          ${notes ? `<div class="archive-notes">${escHtml(notes)}</div>` : ''}
        </div>`;
      }).join('');
    } catch (e) {
      list.innerHTML = `<div style="padding:20px;color:var(--red)">Error: ${escHtml(e.message)}</div>`;
    }
  });
  document.getElementById('archiveClose').addEventListener('click', () => archiveOverlay.classList.remove('open'));
  archiveOverlay.addEventListener('click', e => { if (e.target === archiveOverlay) archiveOverlay.classList.remove('open'); });

  // ── Spec panel ──────────────────────────────────────────────
  const specPanel   = document.getElementById('specPanel');
  const specOverlay = document.getElementById('specOverlay');

  async function openSpecPanel(filename) {
    document.getElementById('specPanelTitle').textContent = filename;
    document.getElementById('specPanelEdit').href =
      `vscode://file/Users/pcasas/src/specs/${encodeURIComponent(filename)}`;
    document.getElementById('specPanelContent').innerHTML =
      '<p style="color:var(--text-muted);font-style:italic">Loading…</p>';
    specPanel.classList.add('open');
    specOverlay.classList.add('open');

    try {
      const res = await fetch(`/specs/${encodeURIComponent(filename)}`);
      if (!res.ok) throw new Error(`${res.status} — file not found`);
      const md = await res.text();
      // marked is loaded from CDN; fall back to <pre> if unavailable
      const html = (typeof marked !== 'undefined')
        ? marked.parse(md, { breaks: false, gfm: true })
        : `<pre style="white-space:pre-wrap">${escHtml(md)}</pre>`;
      document.getElementById('specPanelContent').innerHTML = html;
    } catch (e) {
      document.getElementById('specPanelContent').innerHTML =
        `<p style="color:var(--red)">Could not load <strong>${escHtml(filename)}</strong>: ${escHtml(e.message)}</p>
         <p style="color:var(--text-muted);margin-top:8px;font-size:13px">Create it at <code>/Users/pcasas/src/specs/${escHtml(filename)}</code></p>`;
    }
  }

  function closeSpecPanel() {
    specPanel.classList.remove('open');
    specOverlay.classList.remove('open');
  }

  document.getElementById('specPanelClose').addEventListener('click', closeSpecPanel);
  specOverlay.addEventListener('click', closeSpecPanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSpecPanel(); });

  updateRestartBtn.addEventListener('click', async () => {
    updateRestartBtn.disabled = true;
    updateRestartBtn.textContent = 'Restarting…';
    try {
      await fetch('/restart', { method: 'POST' });
      updateTitle.textContent = '↺ Restarting server…';
      updateOutput.textContent = 'Page will reload in a few seconds.';
      setTimeout(() => location.reload(), 4000);
    } catch (_) {
      // Expected — server went away mid-response
      updateTitle.textContent = '↺ Restarting…';
      updateOutput.textContent = 'Page will reload in a few seconds.';
      setTimeout(() => location.reload(), 4000);
    }
  });
</script>
</body>
</html>
